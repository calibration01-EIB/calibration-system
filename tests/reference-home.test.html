<!DOCTYPE html><html><head><meta charset="utf-8"><title>reference home test</title></head><body>
<pre id="out"></pre>
<script>
/* แปลงมาจาก tests/test_reference_home.py — เครื่องนี้ไม่มี Python และ run-tests.ps1
   เก็บเฉพาะ *.test.html เทสต์เดิมจึงไม่เคยถูกรันเลย */
const results = [];
function t(name, fn) { try { fn(); results.push('PASS ' + name); } catch (e) { results.push('FAIL ' + name + ' — ' + e.message); } }
function ok(cond, msg) { if (!cond) throw new Error(msg || 'expected true'); }
function has(hay, needle, label) { if (hay.indexOf(needle) === -1) throw new Error('ไม่พบ ' + (label || '') + ' ' + JSON.stringify(needle)); }
function eq(a, b, msg) { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error((msg||'') + ' got ' + JSON.stringify(a) + ' want ' + JSON.stringify(b)); }

function text(url) {
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open('GET', url + '?test=' + Date.now());
    x.onload = () => res(x.responseText);
    x.onerror = () => rej(new Error('อ่านไม่ได้ ' + url));
    x.send();
  });
}
function bytes(url) {
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open('GET', url); x.responseType = 'arraybuffer';
    x.onload = () => x.response ? res(new Uint8Array(x.response)) : rej(new Error('ว่าง ' + url));
    x.onerror = () => rej(new Error('อ่านไม่ได้ ' + url));
    x.send();
  });
}
function imageMeta(url) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res({ w: img.naturalWidth, h: img.naturalHeight });
    img.onerror = () => rej(new Error('โหลดรูปไม่ได้ ' + url));
    img.src = url;
  });
}
// อ่านหัว PNG: กว้าง สูง bit depth และ color type (byte 25, 6 = RGBA)
function pngHeader(u8, name) {
  const sig = [137,80,78,71,13,10,26,10];
  for (let i = 0; i < 8; i++) if (u8[i] !== sig[i]) throw new Error(name + ' ไม่ใช่ PNG');
  const be = o => (u8[o]<<24 >>> 0) + (u8[o+1]<<16) + (u8[o+2]<<8) + u8[o+3];
  return { w: be(16), h: be(20), depth: u8[24], colorType: u8[25] };
}

const TILE_ASSETS = ['01_dashboard.png','02_instrument_list.png','03_calibration_tracking.png',
  '04_cert_number.png','05_cert_reference.png','06_calibration_planning.png',
  '07_daily_scale_record.png','08_repair.png','09_offsite_equipment.png'];

/* ขนาดรูปการ์ด: แสดงจริง 108px (มือถือ 76px) เดิมเป็น 1024px = ใหญ่เกินจำเป็นราว 90 เท่า
   ทำให้ APP_SHELL บวม 16.7MB และ cache.addAll() ซึ่งเป็น all-or-nothing เสี่ยงล้มทั้งชุด
   ล็อกช่วงไว้: อย่างน้อย 2 เท่าของขนาดแสดงผล (จอ retina) และห้ามเกิน 512 กันบวมกลับ */
const TILE_MIN = 216, TILE_MAX = 512;

(async () => {
  let INDEX, CSS, HOME_JS, SW;
  try {
    [INDEX, CSS, HOME_JS, SW] = await Promise.all([
      text('../index.html'), text('../theme-aqua.css'),
      text('../js/24-home.js'), text('../sw.js')
    ]);
  } catch (e) {
    document.getElementById('out').textContent = 'FAIL โหลดไฟล์ต้นทางไม่ได้ — ' + e.message;
    document.title = 'FAIL';
    return;
  }

  t('header hooks ครบ', () => {
    ['class="ax-header"','class="ax-brand"','id="axHomeBtn"','aria-label="การแจ้งเตือน"',
     'aria-label="ช่วยเหลือ"','id="axUserName"','id="axUserRole"','id="axUserMenu"']
      .forEach(h => has(INDEX, h, 'header'));
  });

  t('ส่วนประกอบหน้า Home ครบ', () => {
    ['id="pageHome"','class="ax-home"','class="ax-hero ax-hero--split"',
     'src="assets/home-hero-calibration-lab-v2.webp"','id="axTiles"']
      .forEach(h => has(INDEX, h, 'home'));
  });

  t('Home ใช้ picture art direction สำหรับ Hero จอกว้าง', () => {
    has(INDEX, '<picture>');
    has(INDEX, '<source media="(min-width: 1024px)" srcset="assets/home-hero-calibration-lab-wide.webp">');
    has(INDEX, '<img src="assets/home-hero-calibration-lab-v2.webp" alt="">');
    ok(/\.ax-hero-media picture\s*\{[^}]*width:\s*100%[^}]*height:\s*100%/.test(CSS),
      'picture ต้องเต็มกรอบ Hero');
    ok(/@media \(max-width: 1023px\)[\s\S]*?\.ax-hero-media img\s*\{[^}]*object-position:\s*center 58%/.test(CSS),
      'fallback tablet ใช้ focal position เดิม');
  });

  t('ลำดับการ์ดและปลายทางตรงกับระบบจริง', () => {
    const expected = [['dashboard','Dashboard'],['list','รายการเครื่องมือ'],['calrecs','ติดตามผลสอบเทียบ'],
      ['cert','ลำดับเลข Cert'],['weights','ใบ Cert Reference'],['plan','วางแผนสอบเทียบ'],
      ['soon','ใบบันทึกประจำวันเครื่องชั่ง'],['repairs','งานซ่อม'],['gate','นำของออกนอกสถานที่']];
    const pos = expected.map(([page, title]) => {
      const re = new RegExp("page:'" + page + "'[\\s\\S]*?t:'" + title + "'");
      const m = re.exec(HOME_JS);
      if (!m) throw new Error('ไม่เจอการ์ด ' + page + ' / ' + title);
      return m.index;
    });
    eq(pos, pos.slice().sort((a,b) => a-b), 'ลำดับการ์ดต้องเรียงตามนี้');
  });

  t('ตัวเชื่อมกับระบบเดิมยังอยู่', () => {
    ['syncAxTileBadges','axSyncUser','toggleAxUserMenu','axLogout','showPage','AX_ART']
      .forEach(tok => has(HOME_JS, tok, 'integration'));
  });

  t('กริดการ์ด responsive 5 / 3 / 2', () => {
    ok(/\.ax-tiles\s*\{[^}]*repeat\(5/.test(CSS), 'จอใหญ่ต้อง 5 คอลัมน์');
    ok(/@media \(max-width: 1100px\)[\s\S]*?\.ax-tiles\s*\{[^}]*repeat\(3/.test(CSS), '<=1100px ต้อง 3 คอลัมน์');
    ok(/@media \(max-width: 768px\)[\s\S]*?\.ax-tiles\s*\{[^}]*grid-template-columns:\s*repeat\(2,minmax\(0,1fr\)\)/.test(CSS), '<=768px ต้อง 2 คอลัมน์');
  });

  t('HOME Mobile แบบ B กระชับและไม่มี Header ซ้ำ', () => {
    has(INDEX, 'class="ax-mobile-logout"', 'mobile logout');
    has(INDEX, 'id="axMobileMore"', 'mobile more menu');
    has(INDEX, 'id="axMobileMoreBtn"', 'mobile more trigger');
    ok(/@media \(max-width: 768px\)[\s\S]*?body\.app-mode #app \.sidebar\s*\{[^}]*display:\s*none\s*!important/.test(CSS), 'hide duplicate sidebar');
    ok(/@media \(max-width: 768px\)[\s\S]*?\.ax-header-inner\s*\{[^}]*height:\s*56px/.test(CSS), 'compact white header');
    ok(/@media \(max-width: 768px\)[\s\S]*?\.ax-menu\s*\{[^}]*position:\s*fixed[^}]*top:\s*62px[^}]*right:\s*10px[^}]*width:\s*min\(290px,\s*calc\(100vw - 20px\)\)/.test(CSS), 'mobile user menu stays inside viewport');
    ok(/@media \(max-width: 768px\)[\s\S]*?body\.app-mode \.bottom-nav\s*\{[^}]*position:\s*fixed\s*!important[^}]*bottom:\s*0\s*!important[^}]*grid-template-columns:\s*repeat\(5,\s*1fr\)[^}]*overflow:\s*visible\s*!important/.test(CSS), 'five fixed nav items');
    ['home','list','plan','calrecs'].forEach(page => has(INDEX, 'data-page="' + page + '"', 'primary mobile nav ' + page));
    ['toggleAxMobileMore','closeAxMobileMore','syncAxMobileNav'].forEach(name => has(HOME_JS, name, 'mobile more behavior'));
  });

  t('ข้อความ hero ต้องเป็น HTML จริง ไม่ใช่ตัวหนังสือฝังในภาพ', () => {
    /* รูปที่ฝังข้อความไว้ในตัวมีปัญหา 2 อย่างซึ่งวัดได้จริงมาแล้ว:
       - ขนาดตัวอักษรผูกกับความกว้างรูป จอ 542px บรรทัดรองเหลือสูง 6.9px อ่านไม่ออก
       - object-fit: cover ครอปด้านข้างทิ้ง จอ 880px หายไปข้างละ 18% หัวเรื่องขาด
       จึงต้องใช้รูปที่ไม่มีตัวหนังสือ แล้ววางข้อความเป็น HTML ทับ */
    ['ax-hero-media','ax-hero-scrim','ax-hero-copy','ax-hero-kicker']
      .forEach(c => has(INDEX, c, 'hero'));
    ok(/<h1>Calibration System<\/h1>/.test(INDEX), 'หัวเรื่องต้องเป็น <h1> ใน HTML');
    // ขนาดตัวอักษรต้องเป็นค่าคงที่ ไม่ใช่หน่วยที่ผูกกับความกว้างจอ (vw)
    ok(/\.ax-hero-copy h1\s*\{[^}]*font-size:\s*\d+px/.test(CSS), 'h1 ต้องกำหนดขนาดเป็น px');
    ok(/@media \(max-width: 767px\)[\s\S]*?\.ax-hero-copy h1\s*\{[^}]*font-size:\s*\d+px/.test(CSS),
      'มือถือต้องมีขนาดตัวอักษรของตัวเอง');
    // แบนเนอร์แบบฝังข้อความต้องไม่กลับมา
    // เช็คที่ src ไม่ใช่ทั้งไฟล์ — ชื่อไฟล์เดิมยังถูกอ้างในคอมเมนต์เพื่อบอกที่มาของรูปที่ตัดมา
    ok(INDEX.indexOf('src="assets/home-calibration-banner.png"') === -1,
      'index.html ไม่ควรกลับไปใช้แบนเนอร์ที่ฝังข้อความในภาพ');
  });

  t('Hero แบบ Bold Clean ใช้ลำดับขนาดตัวอักษรที่อนุมัติ', () => {
    ok(/\.ax-hero-kicker\s*\{[^}]*font-size:\s*22px/.test(CSS), 'desktop Welcome 22px');
    ok(/\.ax-hero-copy h1\s*\{[^}]*font-size:\s*60px/.test(CSS), 'desktop heading 60px');
    ok(/\.ax-hero-copy p\s*\{[^}]*font-size:\s*18px/.test(CSS), 'desktop supporting copy 18px');
    ok(/@media \(max-width: 1023px\)[\s\S]*?\.ax-hero-kicker\s*\{[^}]*font-size:\s*18px/.test(CSS), 'tablet Welcome 18px');
    ok(/@media \(max-width: 1023px\)[\s\S]*?\.ax-hero-copy h1\s*\{[^}]*font-size:\s*40px/.test(CSS), 'tablet heading 40px');
    ok(/@media \(max-width: 1023px\)[\s\S]*?\.ax-hero-copy p\s*\{[^}]*font-size:\s*16px/.test(CSS), 'tablet supporting copy 16px');
    ok(/@media \(max-width: 768px\)[\s\S]*?\.ax-hero-kicker\s*\{[^}]*font-size:\s*11px/.test(CSS), 'mobile Welcome 11px');
    ok(/@media \(max-width: 768px\)[\s\S]*?\.ax-hero-copy h1\s*\{[^}]*font-size:\s*24px/.test(CSS), 'mobile heading 24px');
    ok(/@media \(max-width: 768px\)[\s\S]*?\.ax-hero-copy p\s*\{[^}]*font-size:\s*10\.5px[^}]*line-height:\s*1\.3/.test(CSS), 'mobile supporting copy 10.5px / 1.3');
  });

  t('Hero แบบ Bold Clean มีเส้น Teal และระยะ Responsive ที่อนุมัติ', () => {
    ok(/\.ax-hero-copy p::after\s*\{[^}]*content:\s*""[^}]*width:\s*72px[^}]*height:\s*4px[^}]*margin-top:\s*15px/.test(CSS), 'desktop accent 72x4 / 15px');
    ok(/@media \(max-width: 1023px\)[\s\S]*?\.ax-hero-copy p::after\s*\{[^}]*width:\s*58px[^}]*height:\s*3px[^}]*margin-top:\s*10px/.test(CSS), 'tablet accent 58x3 / 10px');
    ok(/@media \(max-width: 768px\)[\s\S]*?\.ax-hero-copy p::after\s*\{[^}]*width:\s*32px[^}]*height:\s*3px[^}]*margin-top:\s*5px/.test(CSS), 'mobile accent 32x3 / 5px');
    ok(/\.ax-hero-copy\s*\{[^}]*width:\s*min\(54%,\s*700px\)/.test(CSS), 'desktop copy width');
    ok(/@media \(max-width: 768px\)[\s\S]*?\.ax-hero-copy\s*\{[^}]*padding:\s*12px 14px[^}]*gap:\s*3px/.test(CSS), 'mobile compact spacing');
    has(CSS, 'rgba(247,250,252,.80) 46%', 'desktop stronger scrim');
  });

  t('Hero ใช้ความสูง compact ตาม breakpoint ที่อนุมัติ', () => {
    ok(/\.ax-hero--split\s*\{[^}]*height:\s*260px/.test(CSS), 'desktop 260px');
    ok(/@media \(max-width: 1023px\)[\s\S]*?\.ax-hero--split\s*\{[^}]*height:\s*220px/.test(CSS), 'tablet 220px');
    ok(/@media \(max-width: 768px\)[\s\S]*?\.ax-hero--split\s*\{[^}]*height:\s*140px/.test(CSS), 'mobile 140px');
    ok(/\.ax-hero-media img\s*\{[^}]*object-fit:\s*cover/.test(CSS), 'image cover');
  });

  t('Hero compact มี specificity สูงกว่ากฎ responsive .ax-hero เดิม', () => {
    ok(/#app \.ax-hero--split\s*\{[^}]*height:\s*260px/.test(CSS), 'desktop scoped hero');
    ok(/@media \(max-width: 1023px\)[\s\S]*?#app \.ax-hero--split\s*\{[^}]*height:\s*220px/.test(CSS), 'tablet scoped hero');
    ok(/@media \(max-width: 768px\)[\s\S]*?#app \.ax-hero--split\s*\{[^}]*height:\s*140px/.test(CSS), 'mobile scoped hero');
  });

  try {
    const heroBytes = await bytes('../assets/home-hero-calibration-lab-v2.webp');
    const heroMeta = await imageMeta('../assets/home-hero-calibration-lab-v2.webp');
    ok(heroBytes.length <= 350 * 1024, 'Hero ใหญ่เกิน 350KB: ' + heroBytes.length);
    ok(heroMeta.w >= 1600, 'Hero กว้างต่ำกว่า 1600px: ' + heroMeta.w);
    ok(heroMeta.w / heroMeta.h >= 2.2, 'Hero ไม่ใช่ภาพแนวนอนกว้าง');
    results.push('PASS Hero WebP คมชัดและไม่เกิน 350KB');
  } catch (e) {
    results.push('FAIL Hero WebP คมชัดและไม่เกิน 350KB — ' + e.message);
  }

  try {
    const wideBytes = await bytes('../assets/home-hero-calibration-lab-wide.webp');
    const wideMeta = await imageMeta('../assets/home-hero-calibration-lab-wide.webp');
    eq([wideMeta.w, wideMeta.h], [1920, 320], 'ขนาด Hero จอกว้าง');
    ok(wideBytes.length <= 250 * 1024, 'Hero จอกว้างเกิน 250KB: ' + wideBytes.length);
    results.push('PASS Hero จอกว้าง 1920×320 และไม่เกิน 250KB');
  } catch (e) {
    results.push('FAIL Hero จอกว้าง 1920×320 และไม่เกิน 250KB — ' + e.message);
  }

  // เช็ครูปต้องรอ I/O จึงไม่ใช้ t() (ซึ่งเป็น sync) แต่ทำ try/catch เองแล้ว push ผลตรง ๆ
  try {
    const metas = [];
    for (const f of TILE_ASSETS) metas.push(pngHeader(await bytes('../assets/tiles/' + f), f));
    const uniq = new Set(metas.map(m => m.w + 'x' + m.h + ':' + m.colorType));
    ok(uniq.size === 1, 'รูปการ์ดต้องขนาด/ชนิดเดียวกันทั้งหมด — พบ ' + [...uniq].join(', '));
    const m = metas[0];
    ok(m.w === m.h, 'ต้องเป็นสี่เหลี่ยมจัตุรัส');
    ok(m.colorType === 6, 'ต้องเป็น RGBA (color type 6) พบ ' + m.colorType);
    ok(m.w >= TILE_MIN, 'เล็กเกินไป (' + m.w + 'px) ต้อง >= ' + TILE_MIN);
    ok(m.w <= TILE_MAX, 'ใหญ่เกินจำเป็น (' + m.w + 'px) ต้อง <= ' + TILE_MAX + ' — APP_SHELL จะบวม');
    results.push('PASS รูปการ์ดครบ ขนาดเท่ากัน เป็น RGBA และไม่ใหญ่เกินจำเป็น (' + m.w + 'px)');
  } catch (e) {
    results.push('FAIL รูปการ์ดครบ ขนาดเท่ากัน เป็น RGBA และไม่ใหญ่เกินจำเป็น — ' + e.message);
  }

  t('รูปหน้า Home อยู่ใน APP_SHELL ครบ', () => {
    has(SW, './assets/home-hero-calibration-lab-v2.webp', 'sw');
    TILE_ASSETS.forEach(f => has(SW, './assets/tiles/' + f, 'sw'));
    // เดิมเทสต์ผูกเลขเวอร์ชันตายตัว (calibration-app-v136) ทำให้ต้องแก้เทสต์ทุกครั้งที่ bump
    // เช็คแค่รูปแบบพอ — เนื้อหาที่ต้องคุมจริงคือรายการไฟล์ด้านบน
    ok(/const CACHE_NAME = 'calibration-app-v\d+';/.test(SW), 'CACHE_NAME ต้องเป็นรูปแบบ calibration-app-vN');
  });

  t('Home Hero และ Login Hero อยู่ใน APP_SHELL v148 ครบ', () => {
    has(SW, './assets/home-hero-calibration-lab-wide.webp', 'desktop home hero');
    has(SW, './assets/home-hero-calibration-lab-v2.webp', 'home hero');
    has(SW, './assets/calibration-lab-hero.png', 'login and splash hero');
    ok(SW.indexOf('./assets/hero-lab.jpg') === -1, 'hero-lab.jpg ไม่ควรอยู่ใน APP_SHELL');
    has(SW, "const CACHE_NAME = 'calibration-app-v150';", 'cache bump');
  });

  t('ไม่มีไฟล์กำพร้าใน APP_SHELL (ทุก path ต้องมีคนอ้างถึง)', () => {
    // hero-caliper.png เคยค้างอยู่ใน APP_SHELL ทั้งที่ไม่มีหน้าไหนใช้ = โหลดฟรี 1.3MB
    ok(SW.indexOf('./assets/hero-caliper.png') === -1 || INDEX.indexOf('hero-caliper') !== -1,
      'hero-caliper.png อยู่ใน APP_SHELL แต่ไม่มีหน้าไหนอ้างถึง');
  });

  t('SW เก็บ cache หลังโหลดครั้งแรกได้ และไม่มีซากระบบสอบเทียบตุ้มน้ำหนัก', () => {
    // ระบบสอบเทียบตุ้มน้ำหนัก (ABBA) ถูกล้างออกเพื่อเริ่มใหม่ — ห้ามมีซากค้างใน APP_SHELL
    ['./weight-cal.html','./js/weight-cal.js','./js/19-weight-jobs.js',
     './js/20-weight-cert-xlsx.js','./assets/weight-cert-template.xlsx',
     './assets/tiles/10_weight_calibration.png']
      .forEach(p => ok(SW.indexOf(p) === -1, 'ยังมี ' + p + ' ค้างใน APP_SHELL'));
    // branch สุดท้ายต้องเขียนกลับลง cache ไม่งั้นไฟล์นอก APP_SHELL ใช้ออฟไลน์ไม่ได้ถาวร
    ok(/cache\.put\(event\.request, copy\)[\s\S]*?\}\s*return response;\s*\}\);\s*\}\)\);/.test(SW),
      'branch สุดท้ายของ fetch ต้อง cache.put หลังโหลดสำเร็จ');
    ok(/url\.origin === self\.location\.origin/.test(SW),
      'ต้องจำกัดการเก็บ cache เฉพาะ same-origin กันไปเก็บ response ของ Supabase');
    // เทมเพลตตัวเล็กยังอยู่ใน precache ได้ (18KB / 36KB)
    has(SW, './assets/frm-eib04-template.xlsx', 'sw');
    has(SW, './assets/frm-asset-out-template.xlsx', 'sw');
    ok(SW.indexOf('weight-cal.html ที่เพิ่งถอดออก') === -1,
      'ยังมีคอมเมนต์ runtime เก่าของ weight-cal ใน Service Worker');
    has(SW, './js/08-weights.js', 'ทะเบียน Cert Reference ต้องใช้งานออฟไลน์');
    const cacheVersion = Number((/calibration-app-v(\d+)/.exec(SW) || [])[1]);
    ok(cacheVersion >= 142, 'การเปลี่ยน sw.js ต้อง bump cache เป็น v142 หรือสูงกว่า');
  });

  t('ปุ่มเมนูผู้ใช้ไม่ได้ครอบรายการเมนู', () => {
    has(INDEX, 'class="ax-user-wrap"');
    has(INDEX, '<button type="button" class="ax-user" id="axUser"');
    has(INDEX, '<div class="ax-menu" id="axUserMenu" role="menu">');
    has(INDEX, 'class="ax-menu-item" role="menuitem"');
  });

  document.getElementById('out').textContent = results.join('\n');
  document.title = results.some(r => r.startsWith('FAIL')) ? 'FAIL' : 'ALL PASS';
})();
</script></body></html>
