<!DOCTYPE html><html><head><meta charset="utf-8"><title>instrument list ui test</title></head><body>
<pre id="out"></pre>
<script>
/* แปลงมาจาก tests/test_instrument_list_ui.py */
const results = [];
function t(name, fn) { try { fn(); results.push('PASS ' + name); } catch (e) { results.push('FAIL ' + name + ' — ' + e.message); } }
async function ta(name, fn) { try { await fn(); results.push('PASS ' + name); } catch (e) { results.push('FAIL ' + name + ' — ' + e.message); } }
function ok(cond, msg) { if (!cond) throw new Error(msg || 'expected true'); }
function has(hay, needle, label) { if (hay.indexOf(needle) === -1) throw new Error('ไม่พบ ' + (label || '') + ' ' + JSON.stringify(needle)); }
function eq(a, b, msg) { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error((msg||'') + ' got ' + JSON.stringify(a) + ' want ' + JSON.stringify(b)); }
function functionBody(src, name) {
  const start = src.indexOf('function ' + name + '(');
  if (start < 0) return '';
  const open = src.indexOf('{', start);
  let depth = 0;
  for (let i = open; i < src.length; i++) {
    if (src[i] === '{') depth++;
    if (src[i] === '}' && --depth === 0) return src.slice(open + 1, i);
  }
  return '';
}
function text(url) {
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open('GET', url);
    x.onload = () => res(x.responseText);
    x.onerror = () => rej(new Error('อ่านไม่ได้ ' + url));
    x.send();
  });
}

(async () => {
  let INDEX, REPORTS_JS, INSTRUMENTS_JS, LIST_JS, DASHBOARD_JS, CSS;
  try {
    [INDEX, REPORTS_JS, INSTRUMENTS_JS, LIST_JS, DASHBOARD_JS, CSS] = await Promise.all([
      text('../index.html'), text('../js/04-reports.js'),
      text('../js/03-instruments.js'), text('../js/26-list-ui.js'), text('../js/02-dashboard.js'), text('../theme-aqua.css')
    ]);
  } catch (e) {
    document.getElementById('out').textContent = 'FAIL โหลดไฟล์ต้นทางไม่ได้ — ' + e.message;
    document.title = 'FAIL';
    return;
  }

  t('ค่าเริ่มต้นต่อหน้า = 20 และตรงกับตัวเลือกใน dropdown', () => {
    ok(/let\s+pageSize\s*=\s*20\s*;/.test(REPORTS_JS), 'pageSize ต้องเริ่มที่ 20');
    const sel = /<select\s+id="pageSizeSelect"[^>]*>([\s\S]*?)<\/select>/.exec(INDEX);
    ok(sel, 'ไม่เจอ #pageSizeSelect');
    const opts = [...sel[1].matchAll(/<option\s+value="(\d+)"([^>]*)>/g)].map(m => [m[1], m[2]]);
    eq(opts.map(o => o[0]), ['20','50','100'], 'ตัวเลือกต่อหน้า');
    eq(opts.filter(o => o[1].indexOf('selected') !== -1).map(o => o[0]), ['20'],
      'ตัวที่ถูกเลือกไว้ต้องตรงกับค่าเริ่มต้นของ pageSize ไม่งั้น dropdown โชว์เลขไม่ตรงกับที่แสดงจริง');
  });

  t('เปลี่ยนจำนวนต่อหน้าแล้วรีเซ็ตไปหน้า 1 และวาดตารางใหม่', () => {
    const body = /function\s+changePageSize\(\)\s*\{([\s\S]*?)\}/.exec(REPORTS_JS);
    ok(body, 'ไม่เจอ changePageSize()');
    has(body[1], "pageSize = parseInt(document.getElementById('pageSizeSelect').value)");
    has(body[1], 'currentPage = 1');
    has(body[1], 'renderTable()');
  });

  t('hover ของตารางชัดและจำกัดเฉพาะหน้ารายการเครื่องมือ', () => {
    has(CSS, '#app #pageList .ax-table td { transition: background-color 120ms ease; }');
    has(CSS, '#app #pageList .ax-table tbody tr:hover td { background: #dcefed !important; }');
    has(CSS, '#app #pageList .ax-table tbody tr:hover td:first-child { box-shadow: inset 4px 0 0 var(--accent); }');
  });

  t('โครงสร้างตัวกรองขั้นสูงเข้าถึงได้และปิดไว้ตั้งแต่โหลด', () => {
    ['id="listAdvancedToggle"', 'aria-controls="listAdvancedPanel"',
     'aria-expanded="false"', 'id="listAdvancedPanel"',
     'id="listFilterSummary"', 'id="listResetButton"']
      .forEach(token => has(INDEX, token, 'list filter hook'));
    ok(/id="listAdvancedPanel"[^>]*hidden/.test(INDEX), 'panel ต้องมี hidden ตั้งแต่ HTML แรก');
    ok(/id="listResetButton"[^>]*hidden/.test(INDEX), 'reset ต้องซ่อนเมื่อยังไม่กรอง');
  });

  t('ตัวควบคุมใช้ filterData เดิมและไม่เก็บสถานะ panel', () => {
    ['function listToggleAdvancedFilters', 'function listGetActiveFilterLabels',
     'function listHasActiveFilters', 'function syncListFilterUi',
     'syncListFilterUi();'].forEach(token => has(LIST_JS, token, 'list ui controller'));
    ok(LIST_JS.indexOf("localStorage.setItem('listAdvanced") === -1,
      'สถานะเปิด panel ต้องไม่บันทึกใน localStorage');
    has(LIST_JS, "if (typeof filterData === 'function') filterData();", 'existing filter flow');
  });

  t('CSS จำกัดผลเฉพาะ pageList และ panel ขยายลงด้านล่าง', () => {
    has(CSS, '#app #pageList .ax-filter-card--list', 'scoped list filter');
    has(CSS, '#app #pageList .ax-filter-advanced[hidden]', 'hidden panel');
    ok(/@media \(max-width: 767px\)[\s\S]*?#app #pageList \.ax-filter-row/.test(CSS),
      'mobile filter layout');
  });

  t('มุมมองสเปกใช้ catalog grid และการ์ดไม่แสดงชื่อเครื่องมือ', () => {
    has(INDEX, 'id="listSpecGrid"', 'catalog grid host');
    has(LIST_JS, 'function listSpecCardHtml', 'catalog renderer');
    const cardBody = functionBody(LIST_JS, 'listSpecCardHtml');
    has(cardBody, '<button type="button"', 'native keyboard control');
    has(cardBody, 'aria-label="ดูรายละเอียดเครื่องมือ', 'button accessible name');
    ok(!/<article[^>]*(role="button"|tabindex=)/.test(cardBody), 'article must not nest an interactive role around button');
    has(cardBody, 'ดูรายละเอียด', 'detail button');
    ok(!/instrument_name|Electronic Balance/.test(cardBody),
      'catalog card must omit instrument name/type');
  });

  t('รูปปกโหลดแบบ lazy มี cache และแยก failure รายการ', () => {
    ['ยังไม่มีรูปเครื่องมือ', 'IntersectionObserver', 'const LIST_PHOTO_CACHE = new Map()',
     'function loadListSpecPhoto', 'function renderListSpecPhoto',
     'function observeListSpecPhotos', 'function invalidateListPhotoCache',
     'const LIST_PHOTO_GENERATION = new Map()', 'LIST_PHOTO_ERROR_TTL_MS', "return { state: 'stale' }",
     'bySlot.overview', 'createSignedUrl', 'expiresAt', "img.loading = 'lazy'", "img.decoding = 'async'",
     'message.remove()']
      .forEach(token => has(LIST_JS, token, 'photo contract'));
    has(INSTRUMENTS_JS, 'invalidateListPhotoCache(d.id)', 'photo mutation invalidation');
  });

  t('catalog card มี CSS 4/2/1 คอลัมน์และ state ครบ', () => {
    ['.ax-spec-grid', '.ax-spec-card', '.ax-spec-media', '.ax-spec-id',
     '.ax-spec-cert', '.ax-spec-due', '.ax-spec-detail', '.is-loading', '.is-empty']
      .forEach(token => has(CSS, token, 'catalog CSS'));
    ok(/\.ax-spec-grid\s*\{[^}]*repeat\(4\s*,\s*minmax\(0\s*,\s*1fr\)\)/.test(CSS), 'desktop 4 columns');
    ok(/@media\s*\(max-width:\s*1100px\)[\s\S]*?\.ax-spec-grid\s*\{[^}]*repeat\(2\s*,\s*minmax\(0\s*,\s*1fr\)\)/.test(CSS), 'tablet 2 columns');
    ok(/@media\s*\(max-width:\s*767px\)[\s\S]*?\.ax-spec-grid\s*\{[^}]*minmax\(0\s*,\s*1fr\)/.test(CSS), 'mobile 1 column');
  });

  const fixture = document.createElement('section');
  fixture.innerHTML = `
    <input id="searchInput" value="">
    <select id="typeFilter"><option value="">ทุกประเภท</option><option value="Balance">Balance</option></select>
    <select id="unitFilter"><option value="">ทุกหน่วยงาน</option><option value="WRM1">WRM1</option></select>
    <select id="monthFilter"><option value="">ทุกเดือน</option><option value="8">สิงหาคม</option></select>
    <select id="statusFilter"><option value="">ทุกสถานะ</option><option value="warning">ใกล้ครบ</option></select>
    <button id="listAdvancedToggle" aria-expanded="false"><span>เปิดหมวดและสถานะ</span></button>
    <button id="listResetButton" hidden></button>
    <div id="listFilterSummary" hidden></div>
    <div id="listAdvancedPanel" hidden></div>`;
  document.body.appendChild(fixture);
  window.escapeHtmlText = value => String(value == null ? '' : value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  window.escapeHtmlAttr = window.escapeHtmlText;
  window.escapeJsSingle = value => String(value == null ? '' : value).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  window.formatDate = value => value || '–';
  window.openInstrumentDetail = () => {};
  window.instPhotoFolder = d => `photos_${d.id}_${d.id_code}`;
  window.INST_PHOTO_MAX = 5;
  window.instPhotoArrange = items => ({ bySlot: { overview: items.find(item => /^overview_/.test(item.name)) } });
  eval(LIST_JS);
  eval(DASHBOARD_JS);

  t('renderer สร้าง native Detail button โดยไม่มี nested interactive card', () => {
    const html = listSpecCardHtml({ id: 7, id_code: 'PFP3BB03-WI01', cert_no: 'CAL-7', due_date: '2027-08-24', days_left: 40, instrument_name: 'Electronic Balance' });
    has(html, '<article class="ax-spec-card" data-instrument-id="7"');
    ok(!/<article[^>]*(role="button"|tabindex=)/.test(html), 'article must be non-interactive');
    has(html, '<button type="button" class="ax-spec-detail" aria-label="ดูรายละเอียดเครื่องมือ PFP3BB03-WI01"');
    ok(html.indexOf('Electronic Balance') === -1, 'must omit instrument name');
  });

  t('renders an escaped work-batch shortcut from the unified status map', () => {
    window.calibrationWorkStatusMap = {7:{batchId:'00000000-0000-0000-0000-000000000701',batchNo:'CW7-<1>',
      title:'Unsafe <img src=x onerror=1>',plannedDate:'2026-09-03',status:'in_progress'}};
    const card = listSpecCardHtml({id:7,id_code:'SAFE-7',cert_no:'CERT-7',due_date:'2027-01-01',days_left:40});
    has(card, 'class="cw-registry-shortcut"', 'separate work shortcut');
    has(card, 'data-cw-open-batch-instrument="7"', 'numeric delegated navigation id');
    has(card, 'data-cw-work-status="in_progress"', 'current work-batch status');
    has(card, 'ชุดงาน', 'work label');
    has(card, 'กำลังสอบเทียบ', 'current work-batch action');
    has(card, 'CW7-&lt;1&gt;', 'escaped batch number');
    has(card, '2026-09-03', 'planned date');
    ok(card.indexOf('<img src=x') === -1, 'hostile title cannot create markup');
    ok(card.indexOf('onclick="cwOpenBatchFromInstrument') === -1, 'shortcut avoids per-row inline navigation');
    const actions = listActionCell({id:7,id_code:'SAFE-7',instrument_name:'Balance',cert_no:'CERT-7'});
    has(actions, 'data-cw-work-status="in_progress"', 'work-batch action status');
    has(actions, 'กำลังสอบเทียบ', 'work-batch action label');
    has(DASHBOARD_JS, 'cwRegistryShortcutHtml(id)', 'mobile registry integration');
  });

  t('completed-only history keeps the list planning CTA while active work keeps the batch shortcut', () => {
    window.currentUser = {role:'editor'};
    window.calibrationWorkStatusMap = {7:{batchId:'00000000-0000-0000-0000-000000000701',batchNo:'DONE-7',
      title:'Historical completion',plannedDate:'2026-09-03',status:'completed',isActive:false}};
    const historical = listActionCell({id:7,id_code:'SAFE-7',instrument_name:'Balance',cert_no:'CERT-7'});
    has(historical, 'goToPlanWithItem(7)', 'historical instrument planning CTA');
    has(historical, 'data-cw-work-status="completed"', 'historical completion remains visible');

    window.calibrationWorkStatusMap[7].isActive = true;
    const active = listActionCell({id:7,id_code:'SAFE-7',instrument_name:'Balance',cert_no:'CERT-7'});
    ok(active.indexOf('goToPlanWithItem(7)') === -1, 'active instrument must not offer duplicate planning');
    has(active, 'data-cw-work-status="completed"', 'active completed item remains visible');
    window.currentUser = {role:'viewer'};
    window.calibrationWorkStatusMap[7].isActive = false;
    const readOnly = listActionCell({id:7,id_code:'SAFE-7',instrument_name:'Balance',cert_no:'CERT-7'});
    ok(readOnly.indexOf('goToPlanWithItem(7)') === -1, 'read-only user must not receive a create-plan action');
    has(readOnly, 'data-cw-work-status="completed"', 'read-only user still sees historical work');
    delete window.currentUser;
  });

  t('dashboard due-alert predicate ignores historical completion but suppresses active work', () => {
    ok(typeof window.dashboardIsDueAlertCandidate === 'function', 'dashboard due predicate is exposed');
    const instrument = {id:7,days_left:10};
    ok(window.dashboardIsDueAlertCandidate(instrument, {7:{status:'completed',isActive:false}}),
      'historical completion remains due-alert eligible');
    ok(!window.dashboardIsDueAlertCandidate(instrument, {7:{status:'in_progress',isActive:true}}),
      'active locked work is removed from due alerts');
  });

  t('delegated native work shortcut opens the numeric instrument and keeps keyboard focusable markup', () => {
    let opened = null;
    window.cwOpenBatchFromInstrument = instrumentId => { opened = instrumentId; };
    const host = document.createElement('div');
    host.innerHTML = cwRegistryShortcutHtml(7);
    document.body.appendChild(host);
    const button = host.querySelector('button');
    eq(button.type, 'button', 'native button type');
    button.focus();
    eq(document.activeElement, button, 'shortcut accepts keyboard focus');
    button.click();
    eq(opened, 7, 'delegated shortcut uses validated numeric id');
    host.remove();
  });

  t('work shortcut wraps safely at desktop tablet and mobile widths', () => {
    has(CSS, '#app #pageList .cw-registry-shortcut', 'registry shortcut scoped CSS');
    ok(/#app #pageList \.cw-registry-shortcut\s*\{[^}]*max-width:\s*100%[^}]*white-space:\s*normal/.test(CSS),
      'shortcut wraps without page overflow');
    ok(/@media\s*\(max-width:\s*767px\)[\s\S]*?#app #pageList \.cw-registry-shortcut/.test(CSS),
      'mobile shortcut contract');
  });

  await ta('photo loader เลือก overview และ discard request ก่อน invalidation', async () => {
    let release;
    window.sb = { storage: { from: () => ({
      list: () => new Promise(resolve => { release = resolve; }),
      createSignedUrl: path => Promise.resolve({ data: { signedUrl: 'signed:' + path } })
    }) } };
    const row = { id: 9101, id_code: 'RACE' };
    const pending = loadListSpecPhoto(row, true);
    invalidateListPhotoCache(row.id);
    release({ data: [{ name: '100_photo.jpg' }, { name: 'overview_200.jpg' }] });
    eq((await pending).state, 'stale', 'superseded request');

    const emptyRow = { id: 9103, id_code: 'FIRST' };
    const pendingEmpty = loadListSpecPhoto(emptyRow, true);
    invalidateListPhotoCache(emptyRow.id);
    release({ data: [] });
    eq((await pendingEmpty).state, 'stale', 'superseded empty-folder request');

    window.sb = { storage: { from: () => ({
      list: () => Promise.resolve({ data: [{ name: '100_photo.jpg' }, { name: 'overview_200.jpg' }] }),
      createSignedUrl: path => Promise.resolve({ data: { signedUrl: 'signed:' + path } })
    }) } };
    const ready = await loadListSpecPhoto(row, true);
    eq(ready.name, 'overview_200.jpg', 'overview cover');
  });

  await ta('Storage failure แยกจาก confirmed empty และ force retry ได้', async () => {
    let fail = true;
    window.sb = { storage: { from: () => ({
      list: () => fail ? Promise.resolve({ error: new Error('temporary') }) : Promise.resolve({ data: [] }),
      createSignedUrl: () => Promise.resolve({})
    }) } };
    const row = { id: 9102, id_code: 'ERR' };
    eq((await loadListSpecPhoto(row, true)).state, 'error', 'transient error state');
    fail = false;
    eq((await loadListSpecPhoto(row, true)).state, 'empty', 'confirmed empty state after retry');
  });

  t('panel เปิดปิดได้และเริ่มต้นปิด', () => {
    syncListFilterUi();
    ok(document.getElementById('listAdvancedPanel').hidden, 'เริ่มต้นต้องปิด');
    eq(document.getElementById('listAdvancedToggle').getAttribute('aria-expanded'), 'false');
    listToggleAdvancedFilters();
    ok(!document.getElementById('listAdvancedPanel').hidden, 'กดแล้วต้องเปิด');
    eq(document.getElementById('listAdvancedToggle').getAttribute('aria-expanded'), 'true');
  });

  t('summary แสดงหมวดและสถานะเมื่อปิด panel', () => {
    document.getElementById('typeFilter').value = 'Balance';
    document.getElementById('statusFilter').value = 'warning';
    listToggleAdvancedFilters(false);
    const summary = document.getElementById('listFilterSummary');
    ok(!summary.hidden, 'summary ต้องแสดง');
    has(summary.textContent, 'Balance');
    has(summary.textContent, 'ใกล้ครบ');
  });

  t('reset แสดงเมื่อ filter ใด ๆ ทำงานและซ่อนเมื่อว่าง', () => {
    const reset = document.getElementById('listResetButton');
    ok(!reset.hidden, 'มี type/status แล้ว reset ต้องแสดง');
    ['searchInput','typeFilter','unitFilter','monthFilter','statusFilter']
      .forEach(id => { document.getElementById(id).value = ''; });
    syncListFilterUi();
    ok(reset.hidden, 'ไม่มี filter แล้ว reset ต้องซ่อน');
    document.getElementById('searchInput').value = 'balance';
    syncListFilterUi();
    ok(!reset.hidden, 'มีคำค้นแล้ว reset ต้องแสดง');
  });

  document.getElementById('out').textContent = results.join('\n');
  document.title = results.some(r => r.startsWith('FAIL')) ? 'FAIL' : 'ALL PASS';
})();
</script></body></html>
