const results = [];
function t(name, fn) {
  try { fn(); results.push('PASS ' + name); }
  catch (e) { results.push('FAIL ' + name + ' — ' + e.message); }
}
async function ta(name, fn) {
  document.getElementById('out').textContent = 'FAIL INCOMPLETE — ' + name + '\n' + results.join('\n');
  try { await fn(); results.push('PASS ' + name); }
  catch (e) { results.push('FAIL ' + name + ' — ' + e.message); }
  document.getElementById('out').textContent = 'FAIL INCOMPLETE — remaining assertions\n' + results.join('\n');
}
function ok(value, message) { if (!value) throw new Error(message || 'expected true'); }
function eq(actual, expected, message) { ok(actual === expected, (message || 'values differ') + ': expected ' + JSON.stringify(expected) + ', got ' + JSON.stringify(actual)); }
function throws(fn, message) { let failed = false; try { fn(); } catch (_) { failed = true; } ok(failed, message || 'expected function to throw'); }
function has(text, token, label) { ok(text.indexOf(token) !== -1, (label || 'source') + ' must contain ' + JSON.stringify(token)); }
function lacks(text, token, label) { ok(text.indexOf(token) === -1, (label || 'source') + ' must not contain ' + JSON.stringify(token)); }
function count(text, pattern) { return (text.match(pattern) || []).length; }
function text(url) {
  return new Promise((resolve, reject) => {
    const request = new XMLHttpRequest();
    request.open('GET', url);
    request.onload = () => request.status === 200 || request.status === 0 && request.responseText
      ? resolve(request.responseText)
      : reject(new Error('cannot read ' + url));
    request.onerror = () => reject(new Error('cannot read ' + url));
    request.send();
  });
}

  await ta('service-worker activation evicts query variants before claiming clients', async () => {
    const evictStart = swSource.indexOf('async function evictRetiredAssets(cache)');
    const evictEnd = swSource.indexOf('\n\n/*', evictStart);
    const evict = new Function('RETIRED_ASSET_PATHS', 'return ' + swSource.slice(evictStart, evictEnd))([
      'js/06-plan.js', 'js/15-plan-export.js', 'js/17-frm-cross-month.js', 'assets/frm-eib04-template.xlsx'

    const activationStart = swSource.indexOf("self.addEventListener('activate'");
    const activationEnd = swSource.indexOf('\n});', activationStart) + 3;
    const sequence = [];
    let activation;
    const selfStub = {
      addEventListener: (kind, listener) => { if (kind === 'activate') activation = listener; },
      clients: { claim: () => { sequence.push('claim'); return Promise.resolve(); } }
    };
    const cache = {
      keys: async () => [
        {url:'https://app.test/js/06-plan.js?v=old'},
        {url:'https://app.test/assets/frm-eib04-template.xlsx'},
        {url:'https://app.test/js/06-plan.js.map'}

      keys: async () => ['old-cache', 'calibration-app-v160'],
      delete: async key => { sequence.push('cache:' + key); return true; },
      open: async () => cache
    };
    new Function('self', 'caches', 'CACHE_NAME', 'evictRetiredAssets',
      swSource.slice(activationStart, activationEnd))(selfStub, cachesStub, 'calibration-app-v160', evict);
    let waited;
    activation({waitUntil: promise => { waited = promise; }});
    await waited;

    ok(sequence.every(item => !item.includes('06-plan.js.map')), 'pathname matching does not evict similarly named assets');
  });

  function cwUuid(number) {
    return '00000000-0000-0000-0000-' + String(number).padStart(12, '0');
  }

  function cwPagedClient(rowsByTable, requests, errorsByTable, queryLog, afterFirstPage) {
    const pageCounts = {};
    return { from(table) {
      return { select() {
        const orders = [];
        const upperBounds = [];
        const lowerBounds = [];
        const query = {
          lte(column, value) { upperBounds.push({column, value}); return query; },
          gt(column, value) { lowerBounds.push({column, value}); return query; },
          order(column, options) { orders.push({column, ascending:options.ascending}); return query; },
          async limit(limit) { return respond('limit', 0, limit - 1, limit); },
          async range(from, to) { return respond('range', from, to, to - from + 1); }
        };
        async function respond(method, from, to, limit) {
            requests.push(table + ':' + method + '-' + from + '-' + to);
            if (queryLog) queryLog.push({table, method, from, to, limit, orders:[...orders], upperBounds:[...upperBounds], lowerBounds:[...lowerBounds]});
            const error = errorsByTable && errorsByTable[table];
            if (error) return {data:null, error:{message:error}};
            let data = [...(rowsByTable[table] || [])];
            upperBounds.forEach(bound => {
              data = data.filter(row => row[bound.column] == null || String(row[bound.column]) <= bound.value);
            });
            lowerBounds.forEach(bound => {
              data = data.filter(row => String(row[bound.column] || '') > bound.value);
            });
            data.sort((left, right) => {
              for (const order of orders) {
                const comparison = String(left[order.column] || '').localeCompare(String(right[order.column] || ''));
                if (comparison) return order.ascending ? comparison : -comparison;
              }
              return 0;
            });
            const page = data.slice(from, to + 1).map(row => ({...row}));
            pageCounts[table] = (pageCounts[table] || 0) + 1;
            if (afterFirstPage && pageCounts[table] === 1) afterFirstPage(table, rowsByTable);
            return {data:page, error:null};
        }
        return query;
      } };
    } };
  }

  function cwDeferred() {
    let resolve;
    return { promise:new Promise(done => { resolve = done; }), resolve };
  }

  function cwDeferredClient(deferredByTable) {
    return { from(table) {
      return { select() {
        const query = {
          lte() { return query; },
          gt() { return query; },
          order() { return query; },
          limit() { return deferredByTable[table].promise; },
          range() { return deferredByTable[table].promise; }
        };
        return query;
      } };
    } };
  }

  function cwEvidenceClient(context, options) {
    const config = options || {};
    const requests = [];
    const calls = [];
    const uploads = [];
    const signed = [];
    let removes = 0;
    const removedPaths = [];
    const client = cwPagedClient(context.rows, requests);
    client.supabaseUrl = config.supabaseUrl || 'https://example.test';
    if (config.storageOrigins) client.cwStorageAllowedOrigins = config.storageOrigins;
    if (!config.realHash) client.cwTestSha256 = 'ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad';
    client.storage = { from(bucket) {
      return {
        async upload(path, file, uploadOptions) {
          uploads.push({bucket,path,file,options:uploadOptions});
          if (config.upload) return config.upload(path, file, uploadOptions);
          return {data:{path},error:null};
        },
        async createSignedUrl(path, expiresIn) {
          signed.push({bucket,path,expiresIn});
          if (config.sign) return config.sign(path, expiresIn, signed.length);
          return {data:{signedUrl:'https://example.test/signed-' + signed.length},error:null};
        },
        async remove(paths) {
          removes += 1;
          removedPaths.push({bucket,paths});
          if (config.remove) return config.remove(paths);
          return {data:(paths || []).map(path => ({name:path})),error:null};
        }
      };
    }};
    client.rpc = async (name, payload) => {
      calls.push({name,payload});
      if (config.rpc) return config.rpc(name, payload, context.rows, calls);
      if (name === 'cw_request_orphan_cleanup') return {data:{id:cwUuid(899),status:'pending',storage_path:payload.p_storage_path},error:null};
      if (name === 'cw_confirm_orphan_cleanup') return {data:{id:payload.p_claim_id,status:'succeeded'},error:null};
      if (name !== 'cw_register_document') return {data:null,error:{message:'unexpected RPC ' + name}};
      context.rows.calibration_work_documents.forEach(documentRow => {
        if (documentRow.item_id === payload.p_item_id && documentRow.document_kind === payload.p_document_kind) {
          documentRow.is_current = false;
        }
      });
      const match = /\/v(\d{4})\.pdf$/.exec(payload.p_storage_path);
      const documentRow = {
        id:cwUuid(860 + calls.length),batch_id:payload.p_batch_id,item_id:payload.p_item_id,
        document_kind:payload.p_document_kind,storage_path:payload.p_storage_path,
        version_number:Number(match && match[1]),is_current:true,original_filename:payload.p_original_filename,
        mime_type:payload.p_mime_type,file_size:payload.p_file_size,sha256:payload.p_sha256,
        uploaded_by:'editor-user',uploaded_at:'2026-09-01T06:00:00Z',replacement_reason:payload.p_replacement_reason
      };
      context.rows.calibration_work_documents.push(documentRow);
      const batchRow = context.rows.calibration_work_batches[0];
      if (payload.p_document_kind === 'acknowledgement' && batchRow.status === 'awaiting_acknowledgement_pdf') {
        batchRow.status = 'awaiting_calibration';
      }
      if (payload.p_document_kind === 'closure' && batchRow.status === 'awaiting_closure_pdf') {
        batchRow.status = 'completed';
        context.rows.calibration_work_instrument_locks = [];
      }
      batchRow.updated_at = '2026-09-01T06:00:00Z';

    ].forEach(name => {
      const fn = body(name);
      has(fn, 'security definer', name);
    });
    const actor = body('cw_actor');
    has(actor, "to_regprocedure('public.app_validate_token(text)')", 'legacy token helper detection');
    has(actor, "to_regprocedure('public.current_app_user(uuid)')", 'UUID token helper detection');
    has(actor, 'public.current_app_user($1::uuid)', 'production UUID user lookup');
    has(actor, "p_token !~* '^[0-9a-f]", 'UUID token format validation');
    has(actor, "v_role not in ('admin','editor')", 'write role validation');
  });

  t('uses atomic Bangkok-year numbering, transactional locks, and audits', () => {
    [
      "timezone('asia/bangkok', now())",
      'pg_advisory_xact_lock',
      "'plan-'",
      'insert into public.calibration_work_instrument_locks',
      'delete from public.calibration_work_instrument_locks',
      'insert into public.calibration_work_audit'
    ].forEach(token => has(normalized, token, token));
  });

  t('requires current evidence and protects instrument due dates', () => {
    has(normalized, "document_kind = 'certificate'", 'certificate evidence');
    has(normalized, "document_kind = 'overdue'", 'overdue evidence');
    has(normalized, 'v_item.calibration_date > v_item.planned_date', 'overdue date rule');
    has(normalized, 'set cert_no = v_item.cert_no, cal_date = v_item.calibration_date', 'instrument result update');
    has(normalized, 'due_date', 'explicit due-date safeguard');
    ok(!/update\s+public\.instruments[\s\S]*?due_date\s*=/.test(sql.toLowerCase()), 'RPC must never update due_date');
  });

  t('installs idempotent RLS, storage policies, bucket, and grants', () => {
    [
      'enable row level security',
      "values ('calibration-work-batches', 'calibration-work-batches'",
      'on storage.objects',
      'drop policy if exists',
      'grant execute on function public.cw_create_batch',
      'grant select on public.calibration_work_batches'
    ].forEach(token => has(normalized, token, token));
  });

  t('verifies uploaded evidence against immutable Storage objects', () => {
    const fn = body('cw_register_document');
    [
      'from storage.objects o',
      "o.bucket_id = 'calibration-work-batches'",
      'o.name = p_storage_path',
      "o.metadata ->> 'mimetype'",
      "o.metadata ->> 'size'",
      'v_expected_path',
      'p_storage_path <> v_expected_path',
      'storage_path = p_storage_path',
      "v_storage_mime is distinct from 'application/pdf'",
      'v_storage_size is null'
    ].forEach(token => has(fn, token, token));
    has(fn, 'already referenced', 'duplicate evidence rejection');
  });

  t('allows immutable Storage INSERT and deletion only for an exact pending orphan claim', () => {
    has(normalized, 'create policy calibration_work_storage_insert', 'immutable storage insert');
    has(normalized, "name ~ '^", 'versioned storage path check');
    lacks(normalized, 'create policy calibration_work_storage_update', 'storage policies');
    has(normalized, 'create policy calibration_work_storage_delete_orphan', 'orphan delete policy');
    has(normalized, 'for delete to anon, authenticated', 'claim-scoped client storage delete');
    const guard = body('cw_claimed_orphan_delete_allowed');
    has(guard, "c.status = 'pending'", 'delete requires pending claim');
    has(guard, 'c.storage_path = p_storage_path', 'delete is restricted to exact claimed path');
    has(guard, 'not exists', 'referenced evidence cannot be deleted');
    has(normalized, 'public.cw_claimed_orphan_delete_allowed(public.cw_request_token(), bucket_id, name)', 'delete policy uses guarded exact path');
  });

  t('stages durable orphan cleanup claims without deleting Storage metadata in SQL', () => {
    lacks(normalized, 'delete from storage.objects', 'database cleanup implementation');
    [
      'create table if not exists public.calibration_work_cleanup_claims',
      "check (status in ('pending','succeeded','failed'))",
      'unique (bucket_id, storage_path)',
      'attempt_count integer not null default 1',
      'request_reason text not null',
      'finalized_at timestamptz',
      'failure_detail text'
    ].forEach(token => has(normalized, token, token));

    const cleanup = body('cw_request_orphan_cleanup');
    [
      'from public.cw_actor(p_token, true)',
      "p_bucket_id <> 'calibration-work-batches'",
      "p_storage_path !~ '^",
      'items/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}',
      'from public.calibration_work_batches',
      'from storage.objects o',
      'for key share',
      'from public.calibration_work_documents d',
      'd.storage_path = p_storage_path',
      'object is referenced by document history',
      'from public.calibration_work_cleanup_claims',
      "status = 'pending'",
      'insert into public.calibration_work_cleanup_claims',
      "'request_orphan_cleanup'",
      'insert into public.calibration_work_audit'
    ].forEach(token => has(cleanup, token, token));
    lacks(cleanup, 'is_current', 'cleanup reference guard must cover current and historical evidence');
    const cleanupBatchLock = cleanup.indexOf('from public.calibration_work_batches');
    const cleanupObjectLock = cleanup.indexOf('from storage.objects o');
    ok(cleanupBatchLock < cleanupObjectLock, 'cleanup must lock batch before Storage object');
    const register = body('cw_register_document');
    const registerBatchLock = register.indexOf('from public.calibration_work_batches');
    const registerObjectLock = register.indexOf('from storage.objects o');
    ok(registerBatchLock < registerObjectLock && register.indexOf('for key share') > registerObjectLock,
      'registration must lock batch before Storage object with a conflicting lock');
    has(register, 'from public.calibration_work_cleanup_claims', 'pending cleanup claim guard');
    has(register, "status = 'pending'", 'pending cleanup status guard');
    has(register, 'cleanup is pending for storage path', 'actionable pending cleanup rejection');
  });

  t('finalizes cleanup only through a tightly privileged confirmed service outcome', () => {
    const fn = body('cw_finalize_orphan_cleanup');
    [
      "current_setting('request.jwt.claim.role', true)",
      "current_setting('request.jwt.claims', true)",
      "v_role <> 'service_role'",
      'from public.calibration_work_batches',
      'from public.calibration_work_cleanup_claims',
      'for update',
      'from storage.objects o',
      'storage api deletion is not confirmed',
      "status = 'succeeded'",
      "status = 'failed'",
      "'cleanup_orphan_document_succeeded'",
      "'cleanup_orphan_document_failed'",
      'insert into public.calibration_work_audit'
    ].forEach(token => has(fn, token, token));
    lacks(fn, 'delete from storage.objects', 'service finalizer');
    const batchLock = fn.indexOf('where id = v_batch_id for update');
    const claimLock = fn.indexOf('where id = p_claim_id for update');
    ok(batchLock !== -1 && claimLock !== -1 && batchLock < claimLock,
      'finalizer must lock batch before claim');
    has(normalized,
      'grant execute on function public.cw_finalize_orphan_cleanup(uuid, boolean, text) to service_role',
      'service-only finalizer grant');
    has(normalized,
      'revoke all on function public.cw_finalize_orphan_cleanup(uuid, boolean, text) from anon, authenticated',
      'finalizer client revoke');
    lacks(normalized,
      'grant execute on function public.cw_finalize_orphan_cleanup(uuid, boolean, text) to anon, authenticated',
      'finalizer client grant');
  });

  t('keeps cleanup pending when a failed Storage deletion cannot be confirmed', () => {
    const fn = body('cw_finalize_orphan_cleanup');
    const failureStart = fn.indexOf("else if nullif(btrim(p_failure_detail), '') is null");
    const auditStart = fn.indexOf('insert into public.calibration_work_audit', failureStart);
    ok(failureStart !== -1 && auditStart !== -1, 'failure branch must be independently inspectable');
    const failure = fn.slice(failureStart, auditStart);
    [
      'if not exists ( select 1 from storage.objects o',
      'o.bucket_id = v_claim.bucket_id',
      'o.name = v_claim.storage_path',
      'storage cleanup failure is not confirmed because object is absent',
      "set status = 'failed'"
    ].forEach(token => has(failure, token, token));
    ok(failure.indexOf('if not exists ( select 1 from storage.objects o') < failure.indexOf("set status = 'failed'"),
      'Storage presence must be verified before the claim is failed');
  });

  t('soft-removes reset items while preserving historical rows and documents', () => {
    [
      'is_active boolean not null default true',
      'removed_by text',
      'removed_at timestamptz',
      'removal_reason text'
    ].forEach(token => has(normalized, token, token));
    const fn = body('cw_mutate_items');
    lacks(fn, 'delete from public.calibration_work_items', 'full-set mutation');
    has(fn, 'is_active = false', 'soft removal');
    has(fn, 'removal_reason', 'reasoned removal');
    has(fn, 'insert into public.calibration_work_audit', 'removal audit');
  });

  t('rejects null or empty item sets and counts active items only', () => {
    ['cw_create_batch', 'cw_mutate_items'].forEach(name => {
      const fn = body(name);
      has(fn, 'p_items is null', name + ' null guard');
      has(fn, 'jsonb_array_length(p_items) = 0', name + ' empty guard');
    });
    has(body('cw_mutate_items'), 'where batch_id = p_batch_id and is_active', 'active item invariant');
  });

  t('requires reset before changing resolved or result-bearing planned dates', () => {
    const fn = body('cw_mutate_items');
    has(fn, 'planned_date is distinct from', 'planned-date change detection');
    has(fn, "result_status <> 'in_progress'", 'resolved item guard');
    has(fn, 'd.is_current', 'current result document guard');
    has(fn, 'reset item result before changing planned date', 'actionable rejection');
  });

  t('uses optimistic concurrency for full-set mutation', () => {
    const fn = body('cw_mutate_items');
    has(fn, 'p_expected_updated_at timestamptz', 'mutation signature');
    has(fn, 'p_expected_updated_at is null', 'required version guard');
    has(fn, 'v_batch.updated_at <> p_expected_updated_at', 'stale comparison');
    has(fn, 'stale batch edit', 'stale rejection');
  });

  t('advances the batch version for draft and closure document writes', () => {
    has(body('cw_save_item_draft'), 'cw_refresh_batch_status(v_before.batch_id)', 'draft version bump');
    has(body('cw_register_document'), 'set updated_at = now()', 'closure registration version bump');
  });

  t('locks each batch before its item in result RPCs', () => {
    ['cw_save_item_draft', 'cw_complete_item', 'cw_skip_item', 'cw_reset_item_result'].forEach(name => {
      const fn = body(name);
      const batchLock = fn.indexOf('from public.calibration_work_batches');
      const itemLock = fn.indexOf('from public.calibration_work_items where id = p_item_id for update');
      ok(batchLock !== -1 && itemLock !== -1 && batchLock < itemLock, name + ' must lock batch before item');
    });
  });

  t('atomically completes on initial closure and preserves replacement provenance', () => {
    const register = body('cw_register_document');
    has(register, "v_batch.status = 'awaiting_closure_pdf'", 'initial closure state gate');
    has(register, "set status = 'completed', completed_by = v_actor.username", 'atomic closure completion');
    has(register, 'delete from public.calibration_work_instrument_locks', 'atomic lock release');
    has(register, "'complete_batch'", 'atomic closure transition audit');
    has(register, "v_batch.status = 'completed'", 'replacement state branch');
    has(register, 'set updated_at = now()', 'replacement-only batch update');
    has(normalized, 'drop function if exists public.cw_complete_batch(text, uuid)', 'dead completion RPC removed');
    lacks(normalized, 'grant execute on function public.cw_complete_batch', 'dead completion RPC is not exposed');
  });

  t('invalidates stale pending closure evidence on mutable result paths', () => {
    has(body('cw_mutate_items'), "'invalidate_closure_document'", 'full-set mutation closure invalidation');
    has(body('cw_reset_item_result'), "'invalidate_closure_document'", 'reset closure invalidation');
    const register = body('cw_register_document');
    has(register, 'o.created_at', 'trusted upload timestamp');
    has(register, 'v_storage_created_at < v_batch.updated_at', 'workflow-version evidence gate');
    has(register, 'uploaded evidence predates the current batch version', 'stale upload rejection');
  });

  t('clears saved in-progress results but rejects no-op reset', () => {
    const fn = body('cw_reset_item_result');
    has(fn, "v_before.result_status = 'in_progress'", 'in-progress reset eligibility');
    has(fn, 'v_before.cert_no is not null', 'saved certificate number eligibility');
    has(fn, 'v_before.calibration_date is not null', 'saved calibration date eligibility');
    has(fn, "d.document_kind in ('certificate','overdue')", 'saved evidence eligibility');
    has(fn, 'nothing to reset', 'no-op reset rejection');
    has(fn, "'reset_item_result'", 'reasoned reset audit');
  });

  t('restores the exact pre-completion registry values when a completed item is reset', () => {
    const complete = body('cw_complete_item');
    const reset = body('cw_reset_item_result');
    has(normalized, 'registry_snapshot_taken boolean not null default false', 'registry snapshot marker');
    has(normalized, 'registry_before_cert_no text', 'registry certificate snapshot');
    has(normalized, 'registry_before_cal_date date', 'registry calibration date snapshot');
    has(complete, 'registry_snapshot_taken = true', 'completion records snapshot atomically');
    has(complete, 'registry_before_cert_no =', 'completion records previous certificate');
    has(complete, 'registry_before_cal_date =', 'completion records previous calibration date');
    has(reset, 'update public.instruments', 'reset reconciles registry');
    has(reset, 'is not distinct from v_before.cert_no', 'reset rejects concurrent certificate changes');
    has(reset, 'is not distinct from v_before.calibration_date', 'reset rejects concurrent date changes');
    has(reset, 'cert_no = v_before.registry_before_cert_no', 'reset restores previous certificate');
    has(reset, 'cal_date = v_before.registry_before_cal_date', 'reset restores previous calibration date');
    has(reset, "'restore_instrument_result'", 'registry restoration audit');
  });

  t('backfills registry snapshots for items completed before the snapshot migration', () => {
    has(normalized, "where a.action = 'update_instrument_result'", 'legacy snapshot source audit');
    has(normalized, 'a.before_data ->> \'cert_no\'', 'legacy certificate source');
    has(normalized, "(a.before_data ->> 'cal_date')::date", 'legacy calibration date source');
    has(normalized, "where i.result_status = 'completed' and not i.registry_snapshot_taken", 'backfill only legacy completed items');
  });

  t('audits evidence invalidation and instrument and closure transitions distinctly', () => {
    has(body('cw_mutate_items'), "'invalidate_acknowledgement_document'", 'acknowledgement invalidation audit');
    has(body('cw_reset_item_result'), "'reset_invalidate_documents'", 'reset document invalidation audit');
    has(body('cw_complete_item'), "'update_instrument_result'", 'instrument before/after audit');
    has(body('cw_register_document'), "'complete_batch'", 'batch closure transition audit');
  });

  t('revokes PUBLIC execute on every SECURITY DEFINER function', () => {
    [
      'cw_actor', 'cw_request_token', 'cw_next_batch_no', 'cw_refresh_batch_status',
      'cw_create_batch', 'cw_update_batch_draft', 'cw_confirm_batch', 'cw_mutate_items',
      'cw_register_document', 'cw_save_item_draft', 'cw_complete_item', 'cw_skip_item',
      'cw_reset_item_result', 'cw_cancel_batch',
      'cw_request_orphan_cleanup', 'cw_confirm_orphan_cleanup',
      'cw_claimed_orphan_delete_allowed', 'cw_finalize_orphan_cleanup'
    ].forEach(name => has(normalized, 'revoke all on function public.' + name, name + ' PUBLIC revoke'));
  });

  t('provides an authorized audited draft metadata edit RPC', () => {
    const fn = body('cw_update_batch_draft');
    has(fn, 'security definer', 'draft metadata RPC');
    has(fn, 'from public.cw_actor(p_token, true)', 'draft metadata authorization');
    has(fn, "v_before.status <> 'draft'", 'draft-only guard');
    has(fn, "'update_batch_metadata'", 'metadata audit');
    has(fn, 'p_expected_updated_at', 'metadata concurrency');
  });

  t('database-enforces the complete lock tuple invariant', () => {
    has(normalized, 'unique (batch_id, id, instrument_id)', 'referenced item tuple');
    has(normalized, 'foreign key (batch_id, item_id, instrument_id)', 'lock tuple foreign key');
    has(normalized, 'references public.calibration_work_items(batch_id, id, instrument_id)', 'lock tuple target');
  });

  t('avoids duplicate indexes and covers workflow foreign keys', () => {
    has(normalized, 'drop index if exists public.calibration_work_items_lock_tuple_uidx', 'duplicate tuple index cleanup');
    lacks(normalized, 'create unique index if not exists calibration_work_items_lock_tuple_uidx', 'duplicate tuple index creation');
    const dropFk = normalized.indexOf('drop constraint if exists calibration_work_instrument_locks_tuple_fkey');
    const dropDuplicate = normalized.indexOf('drop index if exists public.calibration_work_items_lock_tuple_uidx');
    const restoreFk = normalized.lastIndexOf('add constraint calibration_work_instrument_locks_tuple_fkey');
    ok(dropFk !== -1 && dropFk < dropDuplicate, 'tuple FK is removed before its possible backing index');
    ok(restoreFk > dropDuplicate, 'tuple FK is restored after duplicate index cleanup');
    [
      'create index if not exists calibration_work_items_instrument_idx',
      'create index if not exists calibration_work_locks_batch_idx',
      'create index if not exists calibration_work_documents_item_idx',
      'create index if not exists calibration_work_audit_item_idx'
    ].forEach(token => has(normalized, token, token));
  });

  t('explicitly revokes internal helpers from Data API roles', () => {
    ['cw_next_batch_no()', 'cw_refresh_batch_status(uuid)'].forEach(signature =>
      has(normalized, 'revoke all on function public.' + signature + ' from anon, authenticated', signature));
  });

  t('each write RPC owns its authorization and audit', () => {
    [
      'cw_create_batch', 'cw_update_batch_draft', 'cw_confirm_batch', 'cw_mutate_items',
      'cw_register_document', 'cw_save_item_draft', 'cw_complete_item', 'cw_skip_item',
      'cw_reset_item_result', 'cw_cancel_batch', 'cw_request_orphan_cleanup'
    ].forEach(name => {
      const fn = body(name);
      has(fn, 'from public.cw_actor(p_token, true)', name + ' authorization');
      has(fn, 'insert into public.calibration_work_audit', name + ' audit');
    });
  });

  document.getElementById('out').textContent = results.join('\n');
  document.title = results.some(result => result.startsWith('FAIL')) ? 'FAIL' : 'ALL PASS';
})();
</script>
</body></html>
