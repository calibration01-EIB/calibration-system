<!DOCTYPE html><html><head><meta charset="utf-8"><title>RUNNING</title></head><body><pre id="out"></pre>
<script src="../js/20-weight-cert-xlsx.js"></script>
<script>
const results=[]; function ok(n,c){results.push((c?'PASS ':'FAIL ')+n);} function eq(n,g,w){results.push((String(g)===String(w)?'PASS ':'FAIL ')+n+' | '+g+' vs '+w);}
function finish(){const f=results.filter(r=>r[0]==='F').length;document.getElementById('out').textContent=results.join('\n');document.title=f?('FAIL '+f):'ALLPASS';}
eq('colIndex A',wxColIndex('A'),1); eq('colIndex AA',wxColIndex('AA'),27);
eq('cellRef',wxCellRef(3,5),'C5');
// set text into an empty row: existing <row r="3"/> gets a <c> with inlineStr
let s='<sheetData><row r="3"></row></sheetData>';
s=wxSetCellText(s,'B3','AT21');
ok('text inserted', s.indexOf('AT21')>=0 && s.indexOf('t="inlineStr"')>=0 && s.indexOf('r="B3"')>=0);
// set number
let s2='<sheetData><row r="3"></row></sheetData>';
s2=wxSetCellNum(s2,'C3',1.5);
ok('num inserted', s2.indexOf('<v>1.5</v>')>=0 && s2.indexOf('r="C3"')>=0 && s2.indexOf('inlineStr')<0);
// overwrite existing cell value
let s3='<sheetData><row r="3"><c r="C3"><v>9</v></c></row></sheetData>';
s3=wxSetCellNum(s3,'C3',1.5);
eq('overwrite once', (s3.match(/r="C3"/g)||[]).length, 1); ok('overwritten val', s3.indexOf('<v>1.5</v>')>=0);
ok('exportWeightXlsx is a function', typeof exportWeightXlsx==='function');
ok('wxFillCover is a function', typeof wxFillCover==='function');
ok('wxFillCertBody is a function', typeof wxFillCertBody==='function');

// ===== Task 3 — sheet registration + resolver =====
let ct='<Types><Override PartName="/xl/worksheets/sheet1.xml" ContentType="a"/></Types>';
let wb='<workbook><sheets><sheet name="Rec" sheetId="4" r:id="rId4"/></sheets></workbook>';
let rl='<Relationships><Relationship Id="rId4" Type="ws" Target="worksheets/sheet4.xml"/></Relationships>';
const r=wxRegisterSheet(ct,wb,rl,'Rec_2','xl/worksheets/sheet7.xml','rId7',7);
ok('ct has new override', r.ctXml.indexOf('/xl/worksheets/sheet7.xml')>=0);
ok('wb has new sheet', r.wbXml.indexOf('name="Rec_2"')>=0 && r.wbXml.indexOf('r:id="rId7"')>=0 && r.wbXml.indexOf('sheetId="7"')>=0);
ok('rels has new rel', r.relsXml.indexOf('Id="rId7"')>=0 && r.relsXml.indexOf('worksheets/sheet7.xml')>=0);
ok('register keeps original sheet', r.wbXml.indexOf('name="Rec"')>=0);

// resolver: name -> full xl/ path (attribute order robust)
const wb2='<workbook><sheets><sheet name="Cover" sheetId="2" r:id="rId1"/><sheet name="CertP2" sheetId="3" r:id="rId2"/><sheet name="Rec" sheetId="4" r:id="rId3"/></sheets></workbook>';
const rl2='<Relationships><Relationship Id="rId3" Type="ws" Target="worksheets/sheet3.xml"/><Relationship Id="rId1" Type="ws" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="ws" Target="worksheets/sheet2.xml"/></Relationships>';
const smap=wxResolveSheets(wb2,rl2);
eq('resolve Cover', smap['Cover'], 'xl/worksheets/sheet1.xml');
eq('resolve Rec', smap['Rec'], 'xl/worksheets/sheet3.xml');

// rename a sheet in workbook.xml (Rec -> Rec_1) keeps r:id/sheetId
let wb3=wxRenameSheet('<sheets><sheet name="Rec" sheetId="4" r:id="rId3"/><sheet name="Unc" sheetId="5" r:id="rId4"/></sheets>','Rec','Rec_1');
ok('rename applied', wb3.indexOf('name="Rec_1"')>=0 && wb3.indexOf('r:id="rId3"')>=0);
ok('rename does not touch Unc', wb3.indexOf('name="Unc"')>=0);

// next-id scanners
eq('max rid', wxMaxRid('<x><Relationship Id="rId3"/><Relationship Id="rId14"/><Relationship Id="rId2"/></x>'), 14);
eq('max sheetId', wxMaxSheetId('<sheet sheetId="2"/><sheet sheetId="6"/><sheet sheetId="3"/>'), 6);
ok('wxCloneSheetFull is a function', typeof wxCloneSheetFull==='function');

// ===== Task 4 — per-point fills (WI01 golden) =====
const P={ nominal_value:1, unit:'mg', marking:'NONE',
  abba:{r1:[0,0,0],t1:[1e-6,0,0],t2:[0,0,0],r2:[0,0,0]}, ci:0,
  correction_mg:-0.00203, uncertainty_mg:0.006, conventional_mass:0.000997966, mc_bar:1.6667e-7,
  mpe_mg:0.006, pass:true, ppm:1, _rhoA:1.19796,
  conventional_mass_str:'1 mg   - 0.002', uncertainty_str:'0.006 mg',
  _budget:{ws:0.001,ds:0.0011547,did:0.00040825,dc:0.0023094,ab:5.7735e-7,wr:0.00086603},
  budget:{u:0.0029297,U:0.0058595,veff:1178.8,k:2,ws:0.001,ds:0.0011547,did:0.00040825,dc:0.0023094,ab:5.7735e-7,wr:0.00086603},
  std:{correction:-0.0022,uncertainty:0.002,ds:0.002,density:7950,serial:'15885',cert_no:'MM-0140-24',due_date:'2026-09-01',id_code:'CLCLRS01-WI01',class_grade:'E2',nominal_value:0.001,unit:'g'},
  comparator:{name:'AT21',id_code:'CLCLMC01-WI01',serial:'1119102616',repeatability:0.0015,linearity:0.004,resolution:1e-6},
  unknown:{id_code:'CLCLSB06-WI01',serial:'N/A',manufacturer:'Mettler Toledo',material:'Stainless',density:7950} };
const CAL={cert_no:'26M001-0', env:{date_cal:'2026-01-15',due_date:'2027-01-15',temp_lo:20.4,temp_hi:20.6,temp_avg:20,rh_lo:54.9,rh_hi:55.1,rh_avg:54.3,press_lo:1020,press_hi:1020,press_avg:1012.6,air_density:1.19796}};

let rec='<sheetData></sheetData>'; rec=wxFillRec(rec,P,CAL);
ok('rec cert M2', rec.indexOf('r="M2"')>=0 && rec.indexOf('26M001-0')>=0);
ok('rec comparator B3', rec.indexOf('r="B3"')>=0 && rec.indexOf('AT21')>=0);
ok('rec ABBA t1 D28', rec.indexOf('r="D28"')>=0 && (rec.indexOf('0.000001')>=0||rec.indexOf('1e-6')>=0));
ok('rec mct N32', rec.indexOf('r="N32"')>=0);
ok('rec error L33', rec.indexOf('r="L33"')>=0 && rec.indexOf('-0.00203')>=0);
ok('rec air density C20', rec.indexOf('r="C20"')>=0);

let unc='<sheetData></sheetData>'; unc=wxFillUnc(unc,P,CAL);
ok('unc nominal B2', unc.indexOf('r="B2"')>=0);
ok('unc ws value E9', unc.indexOf('r="E9"')>=0 && unc.indexOf('0.002')>=0);
ok('unc ui ws I9', unc.indexOf('r="I9"')>=0);
ok('unc raw U I16 (0.00585 not 0.006)', unc.indexOf('r="I16"')>=0 && unc.indexOf('0.0058')>=0);
ok('unc u I15', unc.indexOf('r="I15"')>=0);

let evl='<sheetData></sheetData>'; evl=wxFillEval(evl,P,CAL);
ok('eval cert H7', evl.indexOf('r="H7"')>=0 && evl.indexOf('26M001-0')>=0);
ok('eval row14 nominal A14', evl.indexOf('r="A14"')>=0);
ok('eval result I14', evl.indexOf('r="I14"')>=0);

let res='<sheetData></sheetData>'; res=wxFillResultsRow(res,P,0);
ok('results B55 nominal', res.indexOf('r="B55"')>=0 && res.indexOf('1  mg')>=0);
ok('results F55 conv-mass str', res.indexOf('r="F55"')>=0 && res.indexOf('- 0.002')>=0);
ok('results I55 U str', res.indexOf('r="I55"')>=0 && res.indexOf('0.006 mg')>=0);

let std='<sheetData><row r="21"><c r="A21"><is><t>OLD</t></is></c></row></sheetData>';
std=wxFillStdRow(std,{model:'CLASS E2 ( 1 mg )',serial:'15885',due:'46289',cert:'MM-0140-24'},1);
ok('std row A21 label', std.indexOf('1.) STANDARD WEIGHT')>=0);
ok('std row D21 class', std.indexOf('CLASS E2 ( 1 mg )')>=0);
ok('std row overwrote OLD', std.indexOf('OLD')<0);

eq('dateSerial 2026-01-15', wxDateSerial('2026-01-15'), 46037);
finish();
</script></body></html>
