<!doctype html>
<html><head><meta charset="utf-8"><title>plan retirement contract</title></head><body>
<pre id="out"></pre>
<script>
const results = [];
function t(name, fn) {
  try { fn(); results.push('PASS ' + name); }
  catch (e) { results.push('FAIL ' + name + ' — ' + e.message); }
}
function ok(value, message) { if (!value) throw new Error(message || 'expected true'); }
function has(source, token, label) { ok(source.indexOf(token) !== -1, (label || 'source') + ' must contain ' + JSON.stringify(token)); }
function lacks(source, token, label) { ok(source.indexOf(token) === -1, (label || 'source') + ' must not contain ' + JSON.stringify(token)); }
function text(url) {
  return new Promise((resolve, reject) => {
    const request = new XMLHttpRequest();
    request.open('GET', url);
    request.onload = () => request.status === 200 || request.status === 0 && request.responseText
      ? resolve(request.responseText)
      : reject(new Error('cannot read ' + url));
    request.onerror = () => reject(new Error('cannot read ' + url));
    request.send();
  });
}

(async () => {
  let indexSource, swSource, planSource, reportsSource, assetOutSource, dashboardSource, calRecordsSource, kpiSource;
  try {
    [indexSource, swSource, planSource, reportsSource, assetOutSource, dashboardSource, calRecordsSource, kpiSource] = await Promise.all([
      text('../index.html'),
      text('../sw.js'),
      text('../js/06-plan.js'),
      text('../js/04-reports.js'),
      text('../js/18-asset-out.js'),
      text('../js/02-dashboard.js'),
      text('../js/23-cal-records.js'),
      text('../js/28-kpi.js')
    ]);
  } catch (error) {
    document.getElementById('out').textContent = 'FAIL Task source unavailable — ' + error.message;
    document.title = 'FAIL';
    return;
  }

  t('retires FRM Excel implementation without affecting general imports', () => {
    ['js/06-plan.js', 'js/15-plan-export.js', 'js/17-frm-cross-month.js'].forEach(script => {
      lacks(indexSource, script, script + ' index reference');
      lacks(swSource, './' + script, script + ' cache reference');
    });
    ['แผน FRM', 'ระบบเก่า', 'ลงแผน FRM', 'FRM-EIB04'].forEach(token =>
      lacks(indexSource, token, token + ' UI surface'));
    ['frm_plans', 'calibration_plans', 'calibration_plan_items'].forEach(token =>
      lacks(indexSource, token, token + ' data surface'));
    lacks(swSource, 'assets/frm-eib04-template.xlsx', 'FRM template cache');
    has(indexSource, 'id="importFileInput"', 'general register import remains');
    has(indexSource, 'handleImportFile(this.files[0])', 'general import handler remains');
  });

  t('preserves unrelated Excel exports without the retired runtime', () => {
    has(reportsSource, 'function exportExcel()', 'general register export remains');
    has(assetOutSource, 'function assetOutEscapeXml', 'asset-out XML helper remains');
    has(assetOutSource, 'function assetOutDateSerial', 'asset-out date helper remains');
    lacks(assetOutSource, 'js/15-plan-export.js', 'asset-out legacy runtime dependency');
  });

  t('retires legacy plan data callers in favor of calibration work', () => {
    ['frm_plans', 'calibration_plans', 'calibration_plan_items'].forEach(token => {
      [planSource, dashboardSource, calRecordsSource, kpiSource].forEach(source =>
        lacks(source, token, token + ' source reference'));
    });
    ['planSelectedItems', 'switchPlanTab(', 'planStatusMap'].forEach(token =>
      lacks(calRecordsSource, token, token + ' calibration-record dependency'));
    has(calRecordsSource, 'calibrationWorkStatusMap', 'unified work status source');
    has(calRecordsSource, 'cwOpenBatchFromInstrument', 'unified work detail navigation');
  });

  document.getElementById('out').textContent = results.join('\n');
  document.title = results.some(result => result.startsWith('FAIL')) ? 'FAIL' : 'ALL PASS';
})();
</script>
</body></html>
