<!doctype html>
<html><head><meta charset="utf-8"><title>plan retirement contract</title></head><body>
<pre id="out"></pre>
<script>
const results = [];
function t(name, fn) {
  try { fn(); results.push('PASS ' + name); }
  catch (e) { results.push('FAIL ' + name + ' — ' + e.message); }
}
function ok(value, message) { if (!value) throw new Error(message || 'expected true'); }
function has(source, token, label) { ok(source.indexOf(token) !== -1, (label || 'source') + ' must contain ' + JSON.stringify(token)); }
function lacks(source, token, label) { ok(source.indexOf(token) === -1, (label || 'source') + ' must not contain ' + JSON.stringify(token)); }
function text(url) {
  return new Promise((resolve, reject) => {
    const request = new XMLHttpRequest();
    request.open('GET', url);
    request.onload = () => request.status === 200 || request.status === 0 && request.responseText
      ? resolve(request.responseText)
      : reject(new Error('cannot read ' + url));
    request.onerror = () => reject(new Error('cannot read ' + url));
    request.send();
  });
}
function optionalText(url) {
  return new Promise(resolve => {
    const request = new XMLHttpRequest();
    request.open('GET', url);
    request.onload = () => resolve(request.status === 200 || request.status === 0 ? request.responseText : '');
    request.onerror = () => resolve('');
    request.send();
  });
}

(async () => {
  let indexSource, swSource, planSource, reportsSource, assetOutSource, dashboardSource, kpiSource, themeSource, helperSource, shippedJsSources;
  try {
    [indexSource, swSource, planSource, reportsSource, assetOutSource, dashboardSource, kpiSource, themeSource, helperSource] = await Promise.all([
      text('../index.html'),
      text('../sw.js'),
      text('../js/06-plan.js'),
      text('../js/04-reports.js'),
      text('../js/18-asset-out.js'),
      text('../js/02-dashboard.js'),
      text('../js/28-kpi.js'),
      text('../theme-aqua.css'),
      optionalText('../tools/build-frm-eib04-template.ps1')
    ]);
    const shippedJsPaths = [...new DOMParser().parseFromString(indexSource, 'text/html').querySelectorAll('script[src^="js/"]')]
      .map(script => script.getAttribute('src').split('?')[0]);
    shippedJsSources = await Promise.all([...new Set(shippedJsPaths)].map(path => text('../' + path)));
  } catch (error) {
    document.getElementById('out').textContent = 'FAIL Task source unavailable — ' + error.message;
    document.title = 'FAIL';
    return;
  }
  const appShell = swSource.slice(swSource.indexOf('const APP_SHELL'), swSource.indexOf('];', swSource.indexOf('const APP_SHELL')) + 2);

  t('retires FRM Excel implementation without affecting general imports', () => {
    ['js/06-plan.js', 'js/15-plan-export.js', 'js/17-frm-cross-month.js'].forEach(script => {
      lacks(indexSource, script, script + ' index reference');
      lacks(appShell, './' + script, script + ' cache reference');
    });
    ['แผน FRM', 'ระบบเก่า', 'ลงแผน FRM', 'FRM-EIB04'].forEach(token =>
      lacks(indexSource, token, token + ' UI surface'));
    ['frm_plans', 'calibration_plans', 'calibration_plan_items'].forEach(token =>
      lacks(indexSource, token, token + ' data surface'));
    lacks(appShell, 'assets/frm-eib04-template.xlsx', 'FRM template cache');
    has(indexSource, 'id="importFileInput"', 'general register import remains');
    has(indexSource, 'handleImportFile(this.files[0])', 'general import handler remains');
  });

  t('preserves unrelated Excel exports without the retired runtime', () => {
    has(reportsSource, 'function exportExcel()', 'general register export remains');
    has(assetOutSource, 'function assetOutEscapeXml', 'asset-out XML helper remains');
    has(assetOutSource, 'function assetOutDateSerial', 'asset-out date helper remains');
    lacks(assetOutSource, 'js/15-plan-export.js', 'asset-out legacy runtime dependency');
  });

  t('retires every legacy plan table caller from all shipped JavaScript', () => {
    ['frm_plans', 'calibration_plans', 'calibration_plan_items', 'plan_audit_log'].forEach(token => {
      shippedJsSources.forEach((source, index) =>
        lacks(source, token, token + ' shipped JavaScript source #' + index));
    });
    lacks(indexSource, 'js/23-cal-records.js', 'retired calibration-record module');
    lacks(appShell, './js/23-cal-records.js', 'retired calibration-record cache entry');
  });

  t('removes dead legacy planner styling and callback selectors', () => {
    ['.plan-workspace', '.plan-tabs', '.plan-filter-grid', '.plan-upload', '#planTabNew', '#planStep1',
      '#planStep2', '#planDropZone', '#planFilterType', 'filterPlanInstruments', 'goToPlanStep2', 'submitPlan']
      .forEach(token => lacks(indexSource, token, token + ' retired CSS'));
    ['.plan-workspace', '.plan-tabs', '.plan-filter-grid', '.plan-upload', '#planDropZone',
      'filterPlanInstruments', 'goToPlanStep2', 'submitPlan']
      .forEach(token => lacks(themeSource, token, token + ' retired theme selector'));
  });

  t('retirement deletes the legacy FRM generation helper', () => {
    ok(helperSource === '', 'legacy FRM generation helper must be absent');
    lacks(swSource, 'build-frm-eib04-template.ps1', 'service worker does not expose generator');
    lacks(themeSource, 'build-frm-eib04-template.ps1', 'theme does not expose generator');
  });

  document.getElementById('out').textContent = results.join('\n');
  document.title = results.some(result => result.startsWith('FAIL')) ? 'FAIL' : 'ALL PASS';
})();
</script>
</body></html>
