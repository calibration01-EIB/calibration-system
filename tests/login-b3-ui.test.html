<!DOCTYPE html><html><head><meta charset="utf-8"><title>login B3 ui test</title></head><body>
<pre id="out"></pre>
<script>
const results = [];
function t(name, fn) { try { fn(); results.push('PASS ' + name); } catch (e) { results.push('FAIL ' + name + ' — ' + e.message); } }
async function ta(name, fn) { try { await fn(); results.push('PASS ' + name); } catch (e) { results.push('FAIL ' + name + ' — ' + e.message); } }
function ok(cond, msg) { if (!cond) throw new Error(msg || 'expected true'); }
function has(hay, needle, label) { if (hay.indexOf(needle) === -1) throw new Error('ไม่พบ ' + (label || '') + ' ' + JSON.stringify(needle)); }
function text(url) {
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest(); x.open('GET', url + '?test=' + Date.now());
    x.onload = () => res(x.responseText); x.onerror = () => rej(new Error('อ่านไม่ได้ ' + url)); x.send();
  });
}
(async () => {
  let INDEX, CORE, ROUTER, CSS, SW;
  try {
    [INDEX, CORE, ROUTER, CSS, SW] = await Promise.all([
      text('../index.html'), text('../js/01-core.js'), text('../js/10-router.js'), text('../theme-aqua.css'), text('../sw.js')
    ]);
  } catch (e) {
    document.getElementById('out').textContent = 'FAIL โหลดไฟล์ต้นทางไม่ได้ — ' + e.message;
    document.title = 'FAIL'; return;
  }
  const LOGIN = INDEX.slice(INDEX.indexOf('<!-- LOGIN -->'), INDEX.indexOf('<!-- APP -->'));
  t('โครงสร้าง Editorial Glass ครบ', () => {
    ['class="cal-login-stage"','class="cal-login-brand"','class="cal-login-card"',
     'class="cal-login-logo"','class="cal-support"']
      .forEach(token => has(INDEX, token, 'login markup'));
    has(INDEX, '<span class="cal-brand-welcome">WELCOME</span>', 'welcome line');
    has(INDEX, '<strong class="cal-brand-calibration">CALIBRATION</strong>', 'calibration line');
    has(INDEX, '<span class="cal-brand-system">MANAGEMENT SYSTEM</span>', 'system line');
    has(INDEX, '<label for="loginUsername">Username</label>', 'Username label');
    has(INDEX, '<label for="loginPassword">Password</label>', 'Password label');
  });
  t('ใช้ asset ภายในเครื่องและตัดองค์ประกอบ B3 ที่ไม่อนุมัติ', () => {
    has(INDEX, 'src="assets/ilc-logo-full.png"', 'full ILC logo');
    has(INDEX, 'assets/calibration-lab-hero.png', 'hero');
    ['cal-login-status','cal-ilc-mark','cal-login-heading','cal-submit-arrow',
     'cal-login-meta','Precision you can trust.','ILC DIGITAL LABORATORY','ILC · INTERNAL']
      .forEach(token => ok(LOGIN.indexOf(token) === -1, 'ยังพบองค์ประกอบเก่า ' + token));
  });
  t('integration Login เดิมยังครบ', () => {
    ['id="loginError"','id="loginUsername"','id="loginPassword"','id="loginBtn"',
     "if(event.key==='Enter') doLogin()",'onclick="doLogin()"',
     'onclick="toggleLoginPassword(this)"']
      .forEach(token => has(INDEX, token, 'login integration'));
    has(CORE, 'async function doLogin()', 'doLogin');
    has(CORE, 'function toggleLoginPassword(button)', 'password toggle');
  });
  t('Editorial Glass responsive และ touch target ครบ', () => {
    ok(/@media\(max-width:820px\)/.test(INDEX), 'ต้องมี mobile breakpoint 820px');
    ok(/\.cal-login-input\s*\{[^}]*min-height:\s*56px/.test(INDEX), 'input 56px');
    ok(/\.cal-password-toggle\s*\{[^}]*width:\s*40px[^}]*height:\s*40px/.test(INDEX), 'password toggle 40px inside 56px control');
    ok(/\.cal-submit\s*\{[^}]*min-height:\s*56px/.test(INDEX), 'button 56px');
    ok(/\.cal-login-stage\s*\{[^}]*overflow:\s*hidden/.test(INDEX), 'stage ต้องกัน overflow');
    ok(/\.cal-brand-welcome\s*\{[^}]*letter-spacing:\s*\.38em/.test(INDEX), 'WELCOME tracking');
    ok(/\.cal-brand-system\s*\{[^}]*color:\s*#46d2c4/.test(INDEX), 'ILC teal system title');
  });
  t('loader animation contracts prevent the splash from covering login', () => {
    [
      ['splashFade', '@keyframes splashFade{to{opacity:0;visibility:hidden;pointer-events:none}}'],
      ['calRing', '@keyframes calRing{0%{transform:rotate(-20deg);stroke-dashoffset:84}50%{transform:rotate(180deg);stroke-dashoffset:22}100%{transform:rotate(340deg);stroke-dashoffset:84}}'],
      ['calNeedle', '@keyframes calNeedle{0%,100%{transform:rotate(-34deg)}50%{transform:rotate(42deg)}}'],
      ['calProgress', '@keyframes calProgress{0%{transform:translateX(-110%)}55%{transform:translateX(80%)}100%{transform:translateX(230%)}}']
    ].forEach(([name, contract]) => has(INDEX, contract, name + ' keyframe contract'));
  });
  t('reduced motion hides the splash while disabling loader animation', () => {
    has(INDEX, '@media(prefers-reduced-motion:reduce){#splashScreen{animation:none!important;transition:none!important;opacity:0;visibility:hidden;pointer-events:none}.cal-loader-active,.cal-loader-needle,.cal-loader-progress span{animation:none!important;transition:none!important}}', 'reduced-motion contract');
  });
  t('stage เกือบเต็ม viewport และ mobile ไม่ล้น', () => {
    ok(/#loginPage\s*\{[^}]*padding:\s*8px/.test(INDEX), 'outer safe spacing 8px');
    has(ROUTER, "document.getElementById('loginPage')?.style.setProperty('display', 'block', 'important')",
      'router ต้องเปิด login ด้วย block เพื่อรักษาความกว้างบน mobile');
    ok(/\.cal-login-stage\s*\{[^}]*width:\s*calc\(100vw\s*-\s*16px\)[^}]*min-height:\s*calc\(100svh\s*-\s*16px\)/.test(INDEX), 'near-full viewport stage');
    ok(/\.cal-login-stage\s*\{[^}]*border-radius:\s*24px/.test(INDEX), 'stage radius 24px');
    ok(/\.cal-login-card\s*\{[^}]*top:\s*50%[^}]*transform:\s*translateY\(-50%\)/.test(INDEX), 'desktop card vertical center');
    ok(/\.cal-login-card\s*\{[^}]*height:\s*clamp\(560px,65svh,670px\)[^}]*min-height:\s*560px/.test(INDEX), 'desktop card capped responsive height');
    ok(/@media\(max-width:820px\)\s*\{[\s\S]*?\.cal-login-brand\s*\{[^}]*display:\s*none/.test(INDEX), 'mobile hides editorial brand');
    ok(/@media\(max-width:420px\)\s*\{[\s\S]*?\.cal-login-card\s*\{[^}]*width:\s*calc\(100%\s*-\s*48px\)/.test(INDEX), '320px compact card gutters');
  });
  t('Mobile Compact ใช้ขนาดจริงและคง touch target', () => {
    ok(/@media\(max-width:820px\)\{[\s\S]*?\.cal-login-card\{[^}]*transform:\s*none[^}]*width:\s*min\(calc\(100%\s*-\s*44px\),390px\)[^}]*padding:\s*26px 22px/.test(INDEX), 'mobile card uses real width and padding without scale');
    ok(/@media\(max-width:820px\)\{[\s\S]*?\.cal-login-logo img\{[^}]*width:\s*min\(224px,82%\)/.test(INDEX), 'mobile logo 224px');
    ok(/@media\(max-width:820px\)\{[\s\S]*?\.cal-control\{[^}]*height:\s*46px[^}]*min-height:\s*46px/.test(INDEX), 'mobile control visible height 46px');
    ok(/@media\(max-width:820px\)\{[\s\S]*?\.cal-login-input\{[^}]*min-height:\s*44px/.test(INDEX), 'mobile input fits inside bordered control');
    ok(/@media\(max-width:820px\)\{[\s\S]*?\.cal-password-toggle\{[^}]*width:\s*44px[^}]*height:\s*44px/.test(INDEX), 'password toggle 44px');
    ok(/@media\(max-width:820px\)\{[\s\S]*?\.cal-submit\{[^}]*min-height:\s*46px/.test(INDEX), 'mobile submit 46px');
    ok(/@media\(max-width:420px\)\{[\s\S]*?\.cal-login-card\{[^}]*width:\s*calc\(100%\s*-\s*48px\)[^}]*padding:\s*24px 16px/.test(INDEX), 'small mobile card gutters and padding');
    ok(/@media\(max-width:420px\)\{[\s\S]*?\.cal-login-logo img\{[^}]*width:\s*190px/.test(INDEX), 'small mobile logo 190px');
  });
  t('theme ภายนอกไม่ทับ Hero ใหม่', () => {
    ok(!/#loginPage\s*\{[^}]*background:\s*linear-gradient\(145deg,var\(--navy-1\)/.test(CSS), 'theme-aqua ยังทับพื้นหลัง login');
  });
  t('offline cache มี asset Login และ version ใหม่', () => {
    has(SW, "'./assets/calibration-lab-hero.png'", 'login hero cache');
    has(SW, "'./assets/ilc-logo-full.png'", 'ILC logo cache');
    has(SW, "const CACHE_NAME = 'calibration-app-v159';", 'cache v159');
  });
  t('ปุ่มแสดงรหัสผ่านเปลี่ยนเฉพาะ type และ aria', () => {
    has(CORE, 'function toggleLoginPassword(button)', 'toggle helper');
    has(CORE, "input.type = reveal ? 'text' : 'password'", 'type toggle');
    has(CORE, "button.setAttribute('aria-pressed', String(reveal))", 'aria pressed');
    has(CORE, "button.setAttribute('aria-label', reveal ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน')", 'aria label');
    ok(CORE.indexOf("input.value =") === -1, 'toggle ห้ามแก้ค่ารหัสผ่าน');
  });
  await ta('runtime login keeps editorial submit label after invalid credentials', async () => {
    const fixture = document.createElement('div');
    fixture.hidden = true;
    fixture.innerHTML = '<input id="loginUsername" value="tester"><input id="loginPassword" type="password" value="sample-secret"><div id="loginError" style="display:none"></div><button class="cal-submit" id="loginBtn"><span>เข้าสู่ระบบ</span></button><button class="cal-password-toggle" aria-label="แสดงรหัสผ่าน" aria-pressed="false"></button>';
    document.body.appendChild(fixture);
    const calls = [];
    const runtime = new Function('calCreateClient', 'showToast', CORE + '\nreturn { toggleLoginPassword, doLogin };')(
      () => ({ rpc: async (name, payload) => { calls.push({ name, payload }); return { data: null, error: null }; } }),
      () => {}
    );
    try {
      const password = fixture.querySelector('#loginPassword');
      const passwordToggle = fixture.querySelector('.cal-password-toggle');
      runtime.toggleLoginPassword(passwordToggle);
      ok(password.type === 'text', 'toggle ต้องแสดงรหัสผ่าน');
      ok(passwordToggle.getAttribute('aria-pressed') === 'true', 'toggle ต้องประกาศสถานะแสดง');
      ok(password.value === 'sample-secret', 'toggle ห้ามแก้ค่ารหัสผ่าน');
      runtime.toggleLoginPassword(passwordToggle);
      ok(password.type === 'password', 'toggle ต้องซ่อนรหัสผ่าน');
      ok(passwordToggle.getAttribute('aria-pressed') === 'false', 'toggle ต้องประกาศสถานะซ่อน');
      ok(password.value === 'sample-secret', 'toggle ซ้ำห้ามแก้ค่ารหัสผ่าน');
      const button = fixture.querySelector('#loginBtn');
      await runtime.doLogin();
      ok(fixture.querySelector('#loginError').style.display === 'block', 'invalid login ต้องแสดงข้อความผิดพลาด');
      ok(button.disabled === false, 'invalid login ต้องเปิดปุ่มอีกครั้ง');
      ok(button.querySelector('span').textContent === 'เข้าสู่ระบบ', 'label ต้องกลับเป็นข้อความเดิม');
      ok(button.querySelector('.cal-submit-arrow') === null, 'ปุ่มใหม่ต้องไม่มีลูกศร B3');
      ok(calls.length === 1 && calls[0].name === 'app_login', 'ต้องเรียก app_login หนึ่งครั้ง');
      ok(calls[0].payload.p_username === 'tester' && /^[a-f0-9]{64}$/.test(calls[0].payload.p_password_hash), 'RPC payload ต้องมี username และ password hash');
    } finally {
      fixture.remove();
    }
  });
  document.getElementById('out').textContent = results.join('\n');
  document.title = results.some(r => r.startsWith('FAIL')) ? 'FAIL' : 'ALL PASS';
})();
</script></body></html>
