<!DOCTYPE html><html><head><meta charset="utf-8"><title>RUNNING</title></head><body>
<pre id="out"></pre>
<script src="../js/weight-cal.js"></script>
<script>
const results = [];
function eq(name, got, want){ results.push((String(got)===String(want)?'PASS ':'FAIL ')+name+' | got='+got+' want='+want); }
function near(name, got, want, tol){ results.push((Math.abs(got-want)<=tol?'PASS ':'FAIL ')+name+' | got='+got+' want='+want); }
function finish(){ const f=results.filter(r=>r[0]==='F').length; document.getElementById('out').textContent=results.join('\n'); document.title=f?('FAIL '+f):'ALLPASS'; }

// Task 2 — environment & air density
eq('avgCorr', wcAvgCorr(20.4, 20.6, -0.5), 20);
near('airDensity WI01 (0.061)', wcAirDensity(20, 54.3, 1012.6), 1.19797, 5e-4);

// Task 3 — ABBA & conventional mass
near('mcr WI01', wcMcr(0.001, -0.0022), 0.0009978, 1e-9);
near('delta cycle1 WI01', wcDelta(0, 1e-6, 0, 0), 5e-7, 1e-12);
eq('delta zero cycle', wcDelta(0,0,0,0), 0);
// Ci = 0 when densities equal (whole 26M001 job)
eq('Ci equal densities', wcCi(1.198, 7950, 7950), 0);
// Ci synthetic (different densities), hand-computed:
// (1.0-1.2)*((1/8000)-(1/7950)) = -0.2 * (0.000125 - 0.0001257862...) = 1.57233e-7
near('Ci synthetic', wcCi(1.0, 8000, 7950), 1.57233e-7, 1e-11);

const wi01 = wcConventionalMass({
  abba:{ r1:[0,0,0], t1:[1e-6,0,0], t2:[0,0,0], r2:[0,0,0] },
  nominalG:0.001, refCorrMg:-0.0022, rhoA:wcAirDensity(20,54.3,1012.6), rhoTest:7950, rhoRef:7950
});
near('WI01 mcBar', wi01.mcBar, 1.6667e-7, 1e-10);
near('WI01 mct', wi01.mct, 9.97966e-4, 1e-9);
near('WI01 errorMg', wi01.errorMg, -0.0020333, 1e-6);

// Task 4 — uncertainty budget (WI01)
near('WR ui', wcRepeatabilityMg(0.0015), 8.6603e-4, 1e-7);
const b = wcBudget({ refUmg:0.002, dsMg:0.002, resolutionMg:0.001, linearityMg:0.004, nominalMg:1, ppm:1, repeatMg:0.0015 });
near('WI01 u', b.u, 0.0029297, 1e-6);
near('WI01 U', b.U, 0.0058595, 1e-6);
eq('WI01 k', b.k, 2);
// round-up 2 sig figs (pure, no floor) — 0.0058595 rounds to 0.0059
eq('roundup 0.0058595->0.0059', wcRoundUp2sf(0.0058595), 0.0059);
eq('roundup 0.01234->0.013', wcRoundUp2sf(0.01234), 0.013);
// reported U applies CMC floor first: max(0.0058595, 0.006)=0.006 -> 0.0060
eq('reportedU WI01 (CMC floor)', wcReportedU(0.0058595, 0.006), 0.006);
eq('reportedU computed wins', wcReportedU(0.013, 0.006), 0.013);

// Task 5 — MPE & pass
eq('MPE F1 1mg', wcMpeMg('F1', 1), 0.020);
eq('MPE F1 500mg', wcMpeMg('F1', 500), 0.08);
eq('MPE E2 20mg', wcMpeMg('E2', 20), 0.010);
eq('MPE unknown class', wcMpeMg('ZZ', 1), null);
// WI01 error -0.00203 mg vs F1 MPE 0.020 → 2/3*0.020=0.01333 → pass
eq('pass WI01', wcPass(-0.00203, 0.020), true);
eq('fail big error', wcPass(0.02, 0.020), false);

// Task 7 — orchestration
const pt = wcComputePoint(
  { abba:{r1:[0,0,0],t1:[1e-6,0,0],t2:[0,0,0],r2:[0,0,0]}, nominal_value:1, unit:'mg', marking:'NONE', ppm:1 },
  { temp_lo:20.4, temp_hi:20.6, temp_corr:-0.5, rh_lo:54.9, rh_hi:55.1, rh_corr:-0.7, press_lo:1020, press_hi:1020, press_corr:-7.4 },
  { correction:-0.0022, uncertainty:0.002, density:7950, ds:0.002 },           // std (Dₛ from swDrift)
  { repeatability:0.0015, linearity:0.004, resolution:0.000001 },              // comparator
  { class_grade:'F1', density:7950 },                                           // instrument
  0.006                                                                          // cmcMg for 1 mg (CMC floor)
);
near('computePoint error', pt.correction_mg, -0.0020333, 1e-6);
eq('computePoint U 2sf', pt.uncertainty_mg, 0.006);
eq('computePoint pass', pt.pass, true);

finish();
</script></body></html>
